        if ''preset'' in trigger.entity_id else ''input_text.letzter_sender_'' ~ trigger.entity_id.split(''.'')[1].replace(''radiosender_'',
        '''') }}'
  max: 10
  mode: queued
- id: '1787286971104'
  alias: Radiostream permanent (97.0/105.9/87.5)
  description: 'Konsolidierte Version der drei ehemals separaten ''..._permanent''-Automationen
    (97.0, 105.9, 87.5). Spielt pro Player den gewaehlten Sender dauerhaft via MPD,
    sofern input_boolean.radiostream_<player>_aktiv an ist. Startet beim HA-Neustart,
    bei Senderwechsel sofort, bei Reaktivierung des Aktiv-Schalters sofort, und prueft
    alle 5 Minuten per Watchdog je Player (nur falls aktiv), inkl. Stall-Erkennung
    ueber media_position. Seit 31.08.2026 als repeat: for_each ueber die 3 Player-Suffixe
    implementiert statt 3 kopierter Codebloecke - identisches Verhalten, deutlich
    kompakter und leichter erweiterbar. [20.09.2026: 3s-Pause nach jedem play_media-Aufruf
    ergaenzt - verhindert die am selben Tag entdeckte Race Condition im Add-on, die
    auftrat wenn mehrere Player im selben Automationslauf (z.B. bei ha_start oder
    Watchdog) nahezu gleichzeitig gestartet wurden und dadurch alle Streams auf einem
    einzigen Audio-Sink landeten (Mixing-Bug) statt auf ihren jeweils eigenen.] [23.09.2026:
    Stall-Pruefung um Falscher-Sender-Erkennung erweitert - vergleicht media_content_id
    mit der URL des in input_select.radiosender_<n> gewaehlten Senders (aus sensor.radiostream_senderliste).
    Bei Abweichung wird der richtige Sender neu gestartet. Keine zusaetzliche BT-Aktivitaet,
    reiner Vergleich. Bewusste Folge: manuell ueber den HA-Mediaplayer gestartete
    fremde Inhalte werden innerhalb von 5 Min auf den gewaehlten Sender zurueckgesetzt
    (Presets sind nicht betroffen, sie schreiben in die Senderauswahl).] [23.09.2026
    Traegheits-Fix: (a) Modus ''single'' -> ''queued'' (max 10). Im single-Modus wurden
    Preset-/Senderwechsel waehrend eines laufenden Durchgangs verworfen (Trace: failed_single,
    mehrere 105.9-Presets verschluckt). (b) Ein Senderwechsel bzw. eine Reaktivierung
    bearbeitet jetzt nur noch den betroffenen Player statt alle drei - vorher lief
    jeder Wechsel durch alle drei Player inkl. moeglicher Neustarts mit je 3s Pause.
    Die Gesamtpruefung aller aktiven Player bleibt fuer HA-Start, 5-Min-Watchdog und
    manuelles automation.trigger erhalten. Die 3s-Pause nach jedem Start bleibt als
    Mindestabstand gegen Mixing bestehen; durch queued greift sie auch zwischen schnell
    aufeinanderfolgenden Tipps auf verschiedene Player.] [23.09.2026 Zapp-Fix: Die
    feste 3s-Pause nach JEDEM Start ist ersetzt durch einen gezielten Mixing-Schutz:
    gewartet wird nur, wenn innerhalb der letzten 3s ein ANDERER Player gestartet
    wurde, und nur die Restzeit (gemerkt in input_text.radiostream_letzter_start als
    ''player|zeitstempel''). Schnelles Durchzappen innerhalb eines Players laeuft
    damit ohne Wartezeit. Zusaetzlich werden ueberholte Tipps uebersprungen: stimmt
    die aktuelle Senderauswahl beim Abarbeiten nicht mehr mit dem Tipp ueberein, wird
    dieser Zwischenschritt nicht mehr abgespielt.] [23.09.2026: max_exceeded: silent
    ergaenzt (nur Log-Warnung bei >10 gleichzeitig wartenden Laeufen unterdrueckt).
    Einen Vorschlag ''queued mit max: 2'' bewusst NICHT uebernommen: beim schnellen
    Zappen wuerde ein dritter Tipp still verworfen - oft genau der letzte, also der
    gewollte Sender. Die Logik zum Ueberspringen ueberholter Tipps setzt voraus, dass
    der letzte Tipp in der Warteschlange ankommt.] [24.09.2026 Umzugs-Schutz: Neuer
    Ausloeser ''reconnect'' (ein Player meldet sich nach unavailable zurueck, 20s
    stabil). Dann werden ALLE aktiven Player gestaffelt neu gestartet, auch wenn sie
    laut HA gesund wirken. Hintergrund: PulseAudio zieht beim Neuverbinden eines BT-Lautsprechers
    laufende Streams auf den neuen Sink um (am 24.09. beobachtet: 105.9 spielte nach
    Steckdosen-Reset den Stream von 97.0, obwohl HA fuer 105.9 den richtigen Sender
    meldete). Das erklaert rueckblickend fast alle Mixing-Faelle. Entprellung: liegt
    der letzte Gesamt-Neustart (reconnect oder ha_start, input_datetime.radiostream_letzter_gesamt_neustart)
    weniger als 60s zurueck, wird der Lauf beendet - mehrere Rueckmeldungen z.B. nach
    einer Voll-Reparatur ergeben so nur einen Neustart.] [01.11.2026 Testphase gepatchtes
    Add-on 1b3a7c56 (Claude): Ausloeser reconnect deaktiviert (nicht geloescht), siehe
    Notiz am Ausloeser.] [06.11.2026 Claude, auf Wunsch des Nutzers: Ausloeser ''reconnect''
    samt Entprellung (Helfer input_datetime.radiostream_letzter_gesamt_neustart) endgueltig
    entfernt - das gepatchte Add-on schiebt fehlgeleitete MPD-Streams selbst auf ihre
    Box zurueck (#318); die Falscher-Sender-Erkennung im 5-Min-Watchdog bleibt als
    Netz.] [06.11.2026 Claude, auf Wunsch des Nutzers: schlanker Ersatz fuer ''reconnect''
    - neue Ausloeser ''zurueck_<player>'' (Player kommt aus unavailable zurueck, 20
    s stabil). Bearbeitet wird nur dieser eine Player und nur, wenn er aktiv ist:
    laeuft er nicht, steht er oder spielt den falschen Sender, wird er neu gestartet.
    Die anderen Boxen bleiben unberuehrt. Vorher spielte eine zurueckgekehrte Box
    erst beim naechsten 5-Min-Watchdog wieder.] [07.11.2026 Claude, auf Wunsch des
    Nutzers: zusaetzliche Ausloeser ''gestoppt_<player>'' (Player geht von playing
    auf off/idle/paused und bleibt 20 s so). Fall: nach einem Add-on-Update sprangen
    105.9 und 97.0 direkt von playing auf off, ohne unavailable zu sein - ''zurueck''
    griff nicht, erst der 5-Min-Watchdog startete sie neu. Behandelt wie ''zurueck'':
    nur dieser Player, nur wenn er aktiv ist; ein absichtlicher Stopp ueber den Aktiv-Schalter
    bleibt deshalb aus. Ein Stopp direkt am MPD-Player bei aktivem Schalter wird nach
    20 s rueckgaengig gemacht (vorher spaetestens nach 5 Min durch den Watchdog).]'
  triggers:
  - event: start
    id: ha_start
    trigger: homeassistant
  - id: watchdog
    minutes: /5
    trigger: time_pattern
  - entity_id:
    - input_select.radiosender_97_0
    id: sender_gewechselt_97_0
    trigger: state
    to:
    note: 'to: null = nur echte Zustandswechsel (anderer Sender), keine Attributaenderungen
      wie eine geaenderte Optionsliste'
  - entity_id:
    - input_select.radiosender_105_9
    id: sender_gewechselt_105_9
    trigger: state
    to:
    note: 'to: null = nur echte Zustandswechsel (anderer Sender), keine Attributaenderungen
      wie eine geaenderte Optionsliste'
  - entity_id:
    - input_select.radiosender_87_5
    id: sender_gewechselt_87_5
    trigger: state
    to:
    note: 'to: null = nur echte Zustandswechsel (anderer Sender), keine Attributaenderungen
      wie eine geaenderte Optionsliste'
  - entity_id:
    - input_boolean.radiostream_97_0_aktiv
    id: aktiviert_97_0
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.radiostream_105_9_aktiv
    id: aktiviert_105_9
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.radiostream_87_5_aktiv
    id: aktiviert_87_5
    to: 'on'
    trigger: state
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_97_0
    from: unavailable
    not_to:
    - unavailable
    - unknown
    for:
      seconds: 20
    id: zurueck_97_0
    note: '06.11.2026 (Claude): Player meldet sich nach einem Ausfall zurueck (Reparatur,
      Steckdosen-Zyklus, Add-on-Neustart oder -Update) - nur DIESER Player wird geprueft
      und bei Bedarf gestartet, statt bis zum naechsten 5-Min-Watchdog zu warten'
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_105_9
    from: unavailable
    not_to:
    - unavailable
    - unknown
    for:
      seconds: 20
    id: zurueck_105_9
    note: '06.11.2026 (Claude): Player meldet sich nach einem Ausfall zurueck (Reparatur,
      Steckdosen-Zyklus, Add-on-Neustart oder -Update) - nur DIESER Player wird geprueft
      und bei Bedarf gestartet, statt bis zum naechsten 5-Min-Watchdog zu warten'
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_87_5
    from: unavailable
    not_to:
    - unavailable
    - unknown
    for:
      seconds: 20
    id: zurueck_87_5
    note: '06.11.2026 (Claude): Player meldet sich nach einem Ausfall zurueck (Reparatur,
      Steckdosen-Zyklus, Add-on-Neustart oder -Update) - nur DIESER Player wird geprueft
      und bei Bedarf gestartet, statt bis zum naechsten 5-Min-Watchdog zu warten'
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_97_0
    from: playing
    to:
    - 'off'
    - idle
    - paused
    for:
      seconds: 20
    id: gestoppt_97_0
    note: '07.11.2026 (Claude): Player hoert von selbst auf zu spielen, ohne vorher
      unavailable zu sein (z.B. Add-on-Neustart oder -Update, MPD neu gestartet) -
      nur DIESER Player wird geprueft und, wenn er aktiv ist, nach 20 s neu gestartet
      statt erst beim naechsten 5-Min-Watchdog'
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_105_9
    from: playing
    to:
    - 'off'
    - idle
    - paused
    for:
      seconds: 20
    id: gestoppt_105_9
    note: '07.11.2026 (Claude): Player hoert von selbst auf zu spielen, ohne vorher
      unavailable zu sein (z.B. Add-on-Neustart oder -Update, MPD neu gestartet) -
      nur DIESER Player wird geprueft und, wenn er aktiv ist, nach 20 s neu gestartet
      statt erst beim naechsten 5-Min-Watchdog'
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_87_5
    from: playing
    to:
    - 'off'
    - idle
    - paused
    for:
      seconds: 20
    id: gestoppt_87_5
    note: '07.11.2026 (Claude): Player hoert von selbst auf zu spielen, ohne vorher
      unavailable zu sein (z.B. Add-on-Neustart oder -Update, MPD neu gestartet) -
      nur DIESER Player wird geprueft und, wenn er aktiv ist, nach 20 s neu gestartet
      statt erst beim naechsten 5-Min-Watchdog'
  conditions: []
  actions:
  - repeat:
      for_each:
      - '97_0'
      - '105_9'
      - '87_5'
      sequence:
      - if:
        - condition: template
          value_template: '{% set tid = trigger.id if (trigger is defined and trigger.id
            is defined and trigger.id is string) else '''' %}{% set einzel = tid.startswith(''sender_gewechselt_'')
            or tid.startswith(''aktiviert_'') or tid.startswith(''zurueck_'') or tid.startswith(''gestoppt_'')
            %}{% set aktiv = is_state(''input_boolean.radiostream_'' ~ repeat.item
            ~ ''_aktiv'', ''on'') %}{{ (einzel and tid.endswith(''_'' ~ repeat.item)
            and (aktiv or not (tid.startswith(''zurueck_'') or tid.startswith(''gestoppt_''))))
            or ((not einzel) and aktiv) }}'
        then:
        - if:
          - condition: template
            value_template: '{{ trigger.id == ''sender_gewechselt_'' ~ repeat.item
              }}'
          then:
          - if:
            - condition: template
              value_template: '{{ states(''media_player.musik_radiostream_'' ~ repeat.item)
                != ''unavailable'' }}'
            - condition: template
              value_template: '{{ trigger.to_state is not defined or trigger.to_state.state
                == states(''input_select.radiosender_'' ~ repeat.item) }}'
            then:
            - variables:
                warte: '{% set raw = states(''input_text.radiostream_letzter_start'')
                  %}{% set parts = raw.split(''|'') if ''|'' in raw else ['''', ''0'']
                  %}{% set diff = now().timestamp() - (parts[1] | float(0)) %}{{ (([3
                  - diff, 0] | max) if parts[0] != repeat.item else 0) | round(1)
                  }}'
            - if:
              - condition: template
                value_template: '{{ warte | float(0) > 0 }}'
              then:
              - delay:
                  seconds: '{{ warte | float(0) }}'
              note: Mixing-Schutz nur, wenn innerhalb der letzten 3s ein ANDERER Player
                gestartet wurde - und nur fuer die Restzeit. Zappen innerhalb eines
                Players wartet nicht.
            - action: media_player.play_media
              data:
                media:
                  media_content_id: '{{ state_attr(''sensor.radiostream_senderliste'',
                    states(''input_select.radiosender_'' ~ repeat.item)) }}'
                  media_content_type: music
                  metadata: {}
              target:
                entity_id: media_player.musik_radiostream_{{ repeat.item }}
            - action: input_number.set_value
              data:
                value: -1
              target:
                entity_id: input_number.radiostream_{{ repeat.item }}_letzte_position
            - action: input_text.set_value
              target:
                entity_id: input_text.radiostream_letzter_start
              data:
                value: '{{ repeat.item }}|{{ now().timestamp() }}'
              note: Merkt sich Player und Zeitpunkt dieses Starts fuer den Mixing-Schutz
                des naechsten Starts
            note: Nur abspielen, wenn der Player erreichbar ist UND dieser Tipp noch
              aktuell ist - ueberholte Zwischentipps beim schnellen Zappen werden
              uebersprungen
          else:
          - variables:
              pos_jetzt: '{{ state_attr(''media_player.musik_radiostream_'' ~ repeat.item,
                ''media_position'') | float(-1) }}'
              pos_vorher: '{{ states(''input_number.radiostream_'' ~ repeat.item ~
                ''_letzte_position'') | float(-2) }}'
              url_soll: '{{ state_attr(''sensor.radiostream_senderliste'', states(''input_select.radiosender_''
                ~ repeat.item)) }}'
              url_ist: '{{ state_attr(''media_player.musik_radiostream_'' ~ repeat.item,
                ''media_content_id'') }}'
          - if:
            - condition: template
              value_template: '{{ states(''media_player.musik_radiostream_'' ~ repeat.item)
                != ''playing'' or (pos_jetzt == pos_vorher and pos_jetzt >= 0) or
                (url_soll not in [none, ''''] and url_ist not in [none, ''''] and
                url_soll != url_ist) }}'
            then:
            - if:
              - condition: template
                value_template: '{{ states(''media_player.musik_radiostream_'' ~ repeat.item)
                  != ''unavailable'' }}'
              then:
              - variables:
                  warte: '{% set raw = states(''input_text.radiostream_letzter_start'')
                    %}{% set parts = raw.split(''|'') if ''|'' in raw else ['''',
                    ''0''] %}{% set diff = now().timestamp() - (parts[1] | float(0))
                    %}{{ (([3 - diff, 0] | max) if parts[0] != repeat.item else 0)
                    | round(1) }}'
              - if:
                - condition: template
                  value_template: '{{ warte | float(0) > 0 }}'
                then:
                - delay:
                    seconds: '{{ warte | float(0) }}'
                note: Mixing-Schutz nur, wenn innerhalb der letzten 3s ein ANDERER
                  Player gestartet wurde - und nur fuer die Restzeit. Zappen innerhalb
                  eines Players wartet nicht.
              - action: media_player.play_media
                data:
                  media:
                    media_content_id: '{{ state_attr(''sensor.radiostream_senderliste'',
                      states(''input_select.radiosender_'' ~ repeat.item)) }}'
                    media_content_type: music
                    metadata: {}
                target:
                  entity_id: media_player.musik_radiostream_{{ repeat.item }}
              - action: input_number.set_value
                data:
                  value: -1
                target:
                  entity_id: input_number.radiostream_{{ repeat.item }}_letzte_position
              - action: input_text.set_value
                target:
                  entity_id: input_text.radiostream_letzter_start
                data:
                  value: '{{ repeat.item }}|{{ now().timestamp() }}'
                note: Merkt sich Player und Zeitpunkt dieses Starts fuer den Mixing-Schutz
                  des naechsten Starts
              note: Nur abspielen, wenn der MPD-Player erreichbar ist
            else:
            - action: input_number.set_value
              data:
                value: '{{ pos_jetzt }}'
              target:
                entity_id: input_number.radiostream_{{ repeat.item }}_letzte_position
            note: 'Neu starten, wenn: nicht playing ODER Position steht (Stall) ODER
              falscher Sender laeuft (media_content_id != URL des gewaehlten Senders
              - z.B. nach Mixing-Rueckfall, 23.09.2026 real beobachtet: 87.5 spielte
              den Stream von 97.0)'
        note: Senderwechsel/Reaktivierung/Rueckkehr/Stopp eines Players -> NUR dieser
          Player wird bearbeitet (schnelle Reaktion; bei Rueckkehr oder Stopp nur,
          wenn er aktiv ist). HA-Start, 5-Min-Takt und manuelles Ausloesen -> alle
          aktiven Player (Gesamtpruefung inkl. Stall- und Falscher-Sender-Erkennung).
    note: 'Konsolidiert 31.08.2026: ersetzt 3 fast identische Top-Level-if-Bloecke
      (97.0/105.9/87.5) durch einen repeat: for_each ueber die 3 Player-Suffixe.'
  mode: queued
  max: 10
  max_exceeded: silent
- id: '1787287155553'
  alias: Radiostream stoppen (97.0/105.9/87.5)
  description: 'Konsolidierte Version der drei ehemals separaten ''..._stoppen''-Automationen
    - am 21.08.2026 zusammengefasst, am 05.09.2026 weiter vereinfacht (repeat/choose
    durch templated Target ersetzt, analog zu den anderen konsolidierten Radiostream-Automationen).
    Stoppt den jeweiligen Radiostream-Player, sobald sein input_boolean.radiostream_<player>_aktiv-Schalter
    ausgeschaltet wird. [02.10.2026: Modus single -> queued (max 10) - werden mehrere
    Aktiv-Schalter gleichzeitig ausgeschaltet, ging im single-Modus ein Stopp verloren
    und der Stream lief weiter.]'
  triggers:
  - entity_id:
    - input_boolean.radiostream_97_0_aktiv
    id: '97_0'
    to: 'off'
    trigger: state
  - entity_id:
    - input_boolean.radiostream_105_9_aktiv
    id: '105_9'
    to: 'off'
    trigger: state
  - entity_id:
    - input_boolean.radiostream_87_5_aktiv
    id: '87_5'
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - variables:
      player: '{{ trigger.id }}'
  - action: media_player.media_stop
    target:
      entity_id: media_player.musik_radiostream_{{ player }}
  mode: queued
  max: 10
- id: '1790922426090'
  alias: Radiostream Player nach HA-Start prüfen
  description: 'Schliesst eine Luecke des Watchdogs (automation.radiostream_player_unavailable_bt_audio_manager_bug_watch)
    und der Entwarnung (automation.radiostream_player_wieder_verfugbar_benachrichtigung_loschen):
    beide haengen an einem Zustandswechsel des Players. Ist eine Box schon beim HA-Start
    ''unavailable'' (z.B. nach einem HA-Neustart; den automatischen HA-Neustart als
    Watchdog-Stufe 4 gibt es seit 06.11.2026 nicht mehr), gibt es keinen Wechsel und
    die Reparaturkette startet nie; kommt eine Box waehrend des Neustarts zurueck,
    bleibt die Entwarnung aus und der Ausfall-Merker steht dauerhaft an. Diese Automation
    prueft 3 Minuten nach dem HA-Start jeden Player einmal: (a) seit dem Start durchgehend
    unavailable, aktiv und Steckdose an -> Merker setzen, Push an die drei Geraete,
    EINMAL die Diagnose (script.radiostream_reparieren_ultralight) - bewusst keine
    weitere Eskalation (kein Steckdosen-Zyklus, kein Add-on- oder HA-Neustart), damit
    keine Schleife entsteht; (b) Merker noch an, Player aber wieder da -> Entwarnung
    nachholen. Player, die erst nach dem Start ausfallen oder zurueckkommen, bleiben
    beim Watchdog bzw. der normalen Entwarnung (Abgrenzung ueber last_changed). Die
    Player werden nacheinander bearbeitet, damit keine gleichzeitigen Bluetooth-Aktionen
    entstehen. Eingerichtet 02.10.2026. [06.10.2026 ERGAENZUNG auf Wunsch des Nutzers:
    Bleibt eine Box nach der Diagnose unavailable UND meldet das Add-on sie als per
    Bluetooth getrennt (rest_command.bt_audio_get_devices, connected=false), folgt
    genau EINMAL pro HA-Start der Steckdosen-Zyklus (script.radiostream_steckdose_zyklieren)
    mit 60 s Wartezeit und Nachdiagnose - wie Stufe 2 des Watchdogs. Anlass: Nach
    dem Host-Neustart am 06.10.2026 antwortete 105.9 nicht mehr (br-connection-page-timeout)
    und kam erst nach Aus-/Einschalten von Hand und einem Connect zurueck. Ist die
    Box per Bluetooth verbunden, der Player aber trotzdem unavailable (z.B. MPD-Integration
    erreicht das Add-on nicht), gibt es KEINEN Zyklus - ein Stromreset hilft dann
    nicht. Weiterhin bewusst kein Add-on- und kein HA-Neustart von hier aus, damit
    keine Schleife entsteht. Damit ist die fruehere Aussage ''kein Steckdosen-Zyklus''
    in dieser Beschreibung ueberholt.]'
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - delay: 00:03:05
    note: 'Etwas mehr als 3 Minuten: so lange brauchen Add-on und Boxen maximal zum
      Neuverbinden; die 180-s-Pruefung unten erkennt damit sicher ''seit dem Start
      weg''.'
  - repeat:
      for_each:
      - '97_0'
      - '105_9'
      - '87_5'
      sequence:
      - variables:
          aktiv_ok: '{{ is_state((states(''input_text.radiostream_aktiv_map'') | from_json)[repeat.item],
            ''on'') and is_state((states(''input_text.radiostream_dose_switch_map'')
            | from_json)[repeat.item], ''on'') }}'
          e: media_player.musik_radiostream_{{ repeat.item }}
          label: '{{ repeat.item.replace(''_'', ''.'') }}'
          merker: input_boolean.radiostream_ausfall_gemeldet_{{ repeat.item }}
          seit_start_weg: '{{ states[e] is not none and is_state(e, ''unavailable'')
            and (now() - states[e].last_changed).total_seconds() >= 180 }}'
          wieder_da: '{{ states[e] is not none and states(e) not in [''unavailable'',
            ''unknown''] and (now() - states[e].last_changed).total_seconds() >= 20
            }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ aktiv_ok and seit_start_weg }}'
          sequence:
          - action: input_boolean.turn_on
            note: Merker setzen, damit die normale Entwarnung greift, sobald die Box
              zurueckkommt
            target:
              entity_id: '{{ merker }}'
          - action: script.benachrichtigung_alle_geraete
            data:
              message: '{{ label }} ist seit dem HA-Start nicht erreichbar. Die Diagnose
                läuft jetzt. Ist die Box danach per Bluetooth weiter getrennt, wird
                einmalig ihre Steckdose aus- und eingeschaltet und erneut geprüft.
                Kommt sie auch dann nicht zurück, bitte manuell prüfen (Kopplungsmodus,
                Adapter).'
              title: Radiostream ausgefallen
              daten:
                tag: radiostream_{{ repeat.item }}
            continue_on_error: true
          - action: script.turn_on
            continue_on_error: true
            data:
              variables:
                player: '{{ repeat.item }}'
            target:
              entity_id: script.radiostream_reparieren_ultralight
          - delay:
              seconds: 2
          - continue_on_timeout: true
            note: Auf das Ende der Diagnose warten, bevor der naechste Player geprueft
              wird - keine gleichzeitigen Bluetooth-Aktionen
            timeout:
              seconds: 90
            wait_template: '{{ is_state(''script.radiostream_reparieren_ultralight'',
              ''off'') }}'
          - wait_template: '{{ is_state(''script.radiostream_reparieren_ultralight'',
              ''off'') and is_state(''script.radiostream_reparieren_light'', ''off'')
              and is_state(''script.radiostream_mpd_sicherstellen'', ''off'') }}'
            timeout:
              seconds: 180
            continue_on_timeout: true
            note: '06.10.2026: Die Diagnose kann mit ihren Wiederholungen laenger
              als die 90 s oben laufen - vor dem Steckdosen-Zyklus sicher abwarten,
              bis alle drei Reparatur-Skripte fertig sind'
          - action: rest_command.bt_audio_get_devices
            response_variable: geraete
            continue_on_error: true
            note: '06.10.2026: Nur Bluetooth-Geraete abfragen (keine Sink-Abfrage,
              kein Stocken) - entscheidet, ob ein Steckdosen-Zyklus ueberhaupt sinnvoll
              ist'
          - variables:
              bt_getrennt: '{% set liste = geraete.content.devices if (geraete is
                defined and geraete.content is defined and geraete.content.devices
                is defined) else [] %}{% set d = liste | selectattr(''address'', ''equalto'',
                (states(''input_text.radiostream_address_map'') | from_json)[repeat.item])
                | list | first %}{{ d is defined and d is not none and not d.connected
                }}'
            note: Wahr nur, wenn das Add-on die Box kennt UND sie als getrennt meldet.
              Abfrage fehlgeschlagen oder Box unbekannt -> falsch -> kein Zyklus
          - if:
            - condition: template
              value_template: '{{ is_state(e, ''unavailable'') and bt_getrennt and
                is_state((states(''input_text.radiostream_aktiv_map'') | from_json)[repeat.item],
                ''on'') and is_state((states(''input_text.radiostream_dose_switch_map'')
                | from_json)[repeat.item], ''on'') and is_state(''script.radiostream_reparieren_ultralight'',
                ''off'') and is_state(''script.radiostream_reparieren_light'', ''off'')
                }}'
            then:
            - action: script.benachrichtigung_alle_geraete
              continue_on_error: true
              data:
                message: '{{ label }}: Die Diagnose hat nicht geholfen, die Box ist
                  per Bluetooth weiter getrennt. Schalte einmalig ihre Steckdose aus
                  und wieder ein und prüfe danach erneut.'
                title: Radiostream ausgefallen
                daten:
                  tag: radiostream_{{ repeat.item }}
            - action: script.turn_on
              continue_on_error: true
              target:
                entity_id: script.radiostream_steckdose_zyklieren
              data:
                variables:
                  player: '{{ repeat.item }}'
              note: Reiner Steckdosen-Zyklus OHNE Add-on-Neustart - stoert die anderen
                beiden Boxen nicht
            - delay:
                seconds: 2
            - wait_template: '{{ is_state(''script.radiostream_steckdose_zyklieren'',
                ''off'') }}'
              timeout:
                seconds: 90
              continue_on_timeout: true
              note: Auf das Ende des Steckdosen-Zyklus warten (30s stromlos + Einschalten)
            - delay:
                seconds: 60
              note: Der Box Zeit zum Booten und Neuverbinden geben
            - if:
              - condition: template
                value_template: '{{ is_state(e, ''unavailable'') }}'
              then:
              - action: script.turn_on
                continue_on_error: true
                target:
                  entity_id: script.radiostream_reparieren_ultralight
                data:
                  variables:
                    player: '{{ repeat.item }}'
              - delay:
                  seconds: 2
              - wait_template: '{{ is_state(''script.radiostream_reparieren_ultralight'',
                  ''off'') }}'
                timeout:
                  seconds: 180
                continue_on_timeout: true
                note: Auf das Ende der Nachdiagnose warten, bevor der naechste Player
                  geprueft wird
              note: 'Nachdiagnose wie in Stufe 2 des Watchdogs: verbindet die Box
                neu und startet bei Bedarf den MPD-Dienst nach'
            note: '06.10.2026: EINMAL pro HA-Start und Box - nur wenn der Player noch
              unavailable ist, die Box laut Add-on per Bluetooth getrennt ist, sie
              aktiv ist, ihre Steckdose an ist und keine Reparatur mehr laeuft. Keine
              weitere Eskalation (kein Add-on- oder HA-Neustart)'
        - conditions:
          - condition: template
            value_template: '{{ is_state(merker, ''on'') and wieder_da }}'
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: '{{ merker }}'
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: radiostream_ausfall_musik_radiostream_{{ repeat.item
                }}
          - action: script.benachrichtigung_alle_geraete
            data:
              message: '{{ label }} ist nach dem HA-Neustart wieder erreichbar.'
              title: Radiostream wieder da
              daten:
                tag: radiostream_{{ repeat.item }}
            continue_on_error: true
  mode: single
- id: '1793650190393'
  alias: Radiostream Lautstärke-Sperre an Add-on übertragen
  description: 'Überträgt den Schalter input_boolean.radiostream_lautstarke_fest_100
    an das gepatchte BT-Audio-Add-on (Einstellung volume_lock je Box, ab 2.1.0-cc.6):
    an = Lautstärke gesperrt, aus = normale Lautstärkeregelung. Läuft bei jedem Umschalten
    und beim HA-Start (Abgleich, falls das Add-on einen anderen Stand hat). Boxen
    kommen aus input_text.radiostream_address_map. Angelegt 02.11.2026 von Claude.
    [07.11.2026 Claude, auf Wunsch des Nutzers: Sperr-Wert einstellbar statt fest
    100 % (Add-on ab 2.1.0-cc.16, App-Einstellung volume_lock_level). input_number.radiostream_lautstarke_alle_boxen
    (10-100 %) wird bei jeder Änderung und beim HA-Start per rest_command.bt_audio_put_settings
    an das Add-on gegeben, immer vor dem Sperr-Schalter. Der Wert wirkt auf die MPD-Lautstärke
    aller gesperrten Boxen; Stream und Box bleiben auf 100 %. Unter 100 % hilft er,
    wenn die UKW-Sender bei vollem Pegel übersteuern. Eine reine Wert-Änderung schickt
    den Sperr-Schalter nicht erneut.]'
  triggers:
  - entity_id: input_boolean.radiostream_lautstarke_fest_100
    id: geschaltet
    to:
    - 'on'
    - 'off'
    trigger: state
  - entity_id: input_number.radiostream_lautstarke_alle_boxen
    id: stufe
    not_to:
    - unavailable
    - unknown
    trigger: state
  - event: start
    id: ha_start
    trigger: homeassistant
  conditions: []
  actions:
  - variables:
      adressen: '{{ (states(''input_text.radiostream_address_map'') | from_json).values()
        | list }}'
      sperre: '{{ is_state(''input_boolean.radiostream_lautstarke_fest_100'', ''on'')
        }}'
      stufe: '{{ states(''input_number.radiostream_lautstarke_alle_boxen'') | int(100)
        }}'
  - action: rest_command.bt_audio_put_settings
    continue_on_error: true
    data:
      payload: '{"volume_lock_level": {{ stufe }}}'
    note: Wert zuerst, damit eine im selben Lauf eingeschaltete Sperre gleich auf
      diesem Wert startet
    response_variable: antwort_stufe
  - if:
    - condition: trigger
      id:
      - geschaltet
      - ha_start
    note: Nur bei Umschalten und HA-Start; eine reine Wert-Änderung lässt den Sperr-Schalter
      unberührt
    then:
    - repeat:
        for_each: '{{ adressen }}'
        sequence:
        - action: rest_command.bt_audio_set_volume_lock
          continue_on_error: true
          data:
            address: '{{ repeat.item }}'
            lock: '{{ sperre }}'
          note: Fehler bei einer Box (z. B. Add-on startet gerade) halten die anderen
            nicht auf; das Add-on speichert die Einstellung selbst dauerhaft.
  mode: restart
