  - trigger: state
    entity_id:
    - media_player.musik_radiostream_105_9
    from: playing
    to:
    - 'off'
    - idle
    - paused
    for:
      seconds: 20
    id: gestoppt_105_9
    note: '07.11.2026 (Claude): Player hoert von selbst auf zu spielen, ohne vorher unavailable
