    for:
      seconds: 20
    id: gestoppt_87_5
    note: '07.11.2026 (Claude): Player hoert von selbst auf zu spielen, ohne vorher unavailable
      zu sein (z.B. Add-on-Neustart oder -Update, MPD neu gestartet) - nur DIESER Player wird
      geprueft und, wenn er aktiv ist, nach 20 s neu gestartet statt erst beim naechsten 5-Min-Watchdog'
  conditions: []
  actions:
  - repeat:
      for_each: '{{ states(''input_text.radiostream_address_map'') | from_json | list }}'
      sequence:
      - if:
        - condition: template
          value_template: '{% set tid = trigger.id if (trigger is defined and trigger.id is
            defined and trigger.id is string) else '''' %}{% set einzel = tid.startswith(''sender_gewechselt_'')
            or tid.startswith(''aktiviert_'') or tid.startswith(''zurueck_'') or tid.startswith(''gestoppt_'')
            %}{% set aktiv = is_state(''input_boolean.radiostream_'' ~ repeat.item ~ ''_aktiv'',
            ''on'') %}{{ (einzel and tid.endswith(''_'' ~ repeat.item) and (aktiv or not (tid.startswith(''zurueck_'')
            or tid.startswith(''gestoppt_'')))) or ((not einzel) and aktiv) }}'
        then:
        - if:
          - condition: template
            value_template: '{{ trigger.id == ''sender_gewechselt_'' ~ repeat.item }}'
          then:
          - if:
            - condition: template
              value_template: '{{ states(''media_player.musik_radiostream_'' ~ repeat.item)
                != ''unavailable'' }}'
            - condition: template
              value_template: '{{ trigger.to_state is not defined or trigger.to_state.state
                == states(''select.radiosender_'' ~ repeat.item) }}'
            then:
            - variables:
                warte: '{% set raw = states(''input_text.radiostream_letzter_start'') %}{% set
                  parts = raw.split(''|'') if ''|'' in raw else ['''', ''0''] %}{% set diff
                  = now().timestamp() - (parts[1] | float(0)) %}{{ (([3 - diff, 0] | max) if
                  parts[0] != repeat.item else 0) | round(1) }}'
            - if:
              - condition: template
                value_template: '{{ warte | float(0) > 0 }}'
              then:
              - delay:
                  seconds: '{{ warte | float(0) }}'
              note: Mixing-Schutz nur, wenn innerhalb der letzten 3s ein ANDERER Player gestartet
                wurde - und nur fuer die Restzeit. Zappen innerhalb eines Players wartet nicht.
            - if: &id001
              - condition: template
                value_template: '{{ state_attr(''sensor.radiostream_senderliste'', states(''select.radiosender_''
                  ~ repeat.item)) not in [none, ''''] }}'
              then:
              - action: media_player.play_media
                data:
                  media:
                    media_content_id: '{{ state_attr(''sensor.radiostream_senderliste'', states(''select.radiosender_''
                      ~ repeat.item)) }}'
                    media_content_type: music
                    metadata: {}
                target:
                  entity_id: media_player.musik_radiostream_{{ repeat.item }}
              - action: input_number.set_value
                data:
                  value: -1
                target:
                  entity_id: input_number.radiostream_{{ repeat.item }}_letzte_position
              - action: input_text.set_value
                target:
                  entity_id: input_text.radiostream_letzter_start
                data:
                  value: '{{ repeat.item }}|{{ now().timestamp() }}'
                note: Merkt sich Player und Zeitpunkt dieses Starts fuer den Mixing-Schutz des
                  naechsten Starts
              note: '25.11.2026 (Claude, auf Wunsch des Nutzers): Nur starten, wenn die Senderliste
                fuer den gewaehlten Sender eine Stream-Adresse liefert. Fehlt sie kurz (z. B.
                beim Neuladen der Template-Entitaeten), wird die Box in diesem Lauf uebersprungen
                statt den ganzen Lauf fuer alle Boxen abzubrechen (21.11.2026 21:44: media_content_id
                None); der naechste Lauf (spaetestens 5 Min) versucht es erneut.'
            note: Nur abspielen, wenn der Player erreichbar ist UND dieser Tipp noch aktuell
              ist - ueberholte Zwischentipps beim schnellen Zappen werden uebersprungen
          else:
          - variables:
              pos_jetzt: '{{ state_attr(''media_player.musik_radiostream_'' ~ repeat.item, ''media_position'')
                | float(-1) }}'
              pos_vorher: '{{ states(''input_number.radiostream_'' ~ repeat.item ~ ''_letzte_position'')
                | float(-2) }}'
              url_soll: '{{ state_attr(''sensor.radiostream_senderliste'', states(''select.radiosender_''
                ~ repeat.item)) }}'
              url_ist: '{{ state_attr(''media_player.musik_radiostream_'' ~ repeat.item, ''media_content_id'')
                }}'
          - if:
            - condition: template
              value_template: '{{ states(''media_player.musik_radiostream_'' ~ repeat.item)
                != ''playing'' or (pos_jetzt == pos_vorher and pos_jetzt >= 0) or (url_soll
                not in [none, ''''] and url_ist not in [none, ''''] and url_soll != url_ist)
                }}'
            then:
            - if:
              - condition: template
                value_template: '{{ states(''media_player.musik_radiostream_'' ~ repeat.item)
                  != ''unavailable'' }}'
              then:
              - variables:
                  warte: '{% set raw = states(''input_text.radiostream_letzter_start'') %}{%
                    set parts = raw.split(''|'') if ''|'' in raw else ['''', ''0''] %}{% set
                    diff = now().timestamp() - (parts[1] | float(0)) %}{{ (([3 - diff, 0] |
                    max) if parts[0] != repeat.item else 0) | round(1) }}'
              - if:
                - condition: template
                  value_template: '{{ warte | float(0) > 0 }}'
                then:
                - delay:
                    seconds: '{{ warte | float(0) }}'
                note: Mixing-Schutz nur, wenn innerhalb der letzten 3s ein ANDERER Player gestartet
                  wurde - und nur fuer die Restzeit. Zappen innerhalb eines Players wartet nicht.
              - if: *id001
                then:
                - action: media_player.play_media
                  data:
                    media:
                      media_content_id: '{{ state_attr(''sensor.radiostream_senderliste'', states(''select.radiosender_''
                        ~ repeat.item)) }}'
                      media_content_type: music
                      metadata: {}
                  target:
                    entity_id: media_player.musik_radiostream_{{ repeat.item }}
                - action: input_number.set_value
                  data:
                    value: -1
                  target:
                    entity_id: input_number.radiostream_{{ repeat.item }}_letzte_position
                - action: input_text.set_value
                  target:
                    entity_id: input_text.radiostream_letzter_start
                  data:
                    value: '{{ repeat.item }}|{{ now().timestamp() }}'
                  note: Merkt sich Player und Zeitpunkt dieses Starts fuer den Mixing-Schutz
                    des naechsten Starts
                note: '25.11.2026 (Claude, auf Wunsch des Nutzers): Nur starten, wenn die Senderliste
                  fuer den gewaehlten Sender eine Stream-Adresse liefert. Fehlt sie kurz (z.
                  B. beim Neuladen der Template-Entitaeten), wird die Box in diesem Lauf uebersprungen
                  statt den ganzen Lauf fuer alle Boxen abzubrechen (21.11.2026 21:44: media_content_id
                  None); der naechste Lauf (spaetestens 5 Min) versucht es erneut.'
              note: Nur abspielen, wenn der MPD-Player erreichbar ist
            else:
            - action: input_number.set_value
              data:
                value: '{{ pos_jetzt }}'
              target:
                entity_id: input_number.radiostream_{{ repeat.item }}_letzte_position
            note: 'Neu starten, wenn: nicht playing ODER Position steht (Stall) ODER falscher
              Sender laeuft (media_content_id != URL des gewaehlten Senders - z.B. nach Mixing-Rueckfall,
              23.09.2026 real beobachtet: 87.5 spielte den Stream von 97.0)'
        note: Senderwechsel/Reaktivierung/Rueckkehr/Stopp eines Players -> NUR dieser Player
          wird bearbeitet (schnelle Reaktion; bei Rueckkehr oder Stopp nur, wenn er aktiv ist).
          HA-Start, 5-Min-Takt und manuelles Ausloesen -> alle aktiven Player (Gesamtpruefung
          inkl. Stall- und Falscher-Sender-Erkennung).
    note: 'Konsolidiert 31.08.2026: ersetzt 3 fast identische Top-Level-if-Bloecke (97.0/105.9/87.5)
      durch einen repeat: for_each ueber die 3 Player-Suffixe.'
  mode: queued
  max: 10
  max_exceeded: silent
  trace:
    stored_traces: 30
- id: '1787287155553'
  alias: Radiostream stoppen (97.0/105.9/87.5)
  description: 'Konsolidierte Version der drei ehemals separaten ''..._stoppen''-Automationen
    - am 21.08.2026 zusammengefasst, am 05.09.2026 weiter vereinfacht (repeat/choose durch
    templated Target ersetzt, analog zu den anderen konsolidierten Radiostream-Automationen).
    Stoppt den jeweiligen Radiostream-Player, sobald sein input_boolean.radiostream_<player>_aktiv-Schalter
    ausgeschaltet wird. [02.10.2026: Modus single -> queued (max 10) - werden mehrere Aktiv-Schalter
    gleichzeitig ausgeschaltet, ging im single-Modus ein Stopp verloren und der Stream lief
    weiter.]'
  triggers:
