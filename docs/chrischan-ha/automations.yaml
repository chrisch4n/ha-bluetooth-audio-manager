# Export aus Home Assistant (automations.yaml), nur Radiostream-Teile, Stand 25.11.2026.
# Anonymisiert: Box-MACs -> <MAC_87_5>/<MAC_105_9>/<MAC_97_0>, Mobilgeraete -> geraet_1..4.
# Beschreibung des Systems: ../chrischan-radiostream.md
- id: '1786256754488'
  alias: Radiostream Player unavailable (BT Audio Manager Bug-Watch)
  description: 'Eskalation, wenn eine aktive Box mit eingeschalteter Steckdose ausfaellt (Player
    unavailable) oder erreichbar ist, aber nicht spielt (binary_sensor.radiostream_<p>_spielt_nicht;
    nur mit Internet). Stufen bei unavailable nach 3/5/20/30 Min, bei spielt nicht nach 15/20/30/40
    Min: 1 Diagnose (script.radiostream_reparieren_ultralight), 2 Steckdosen-Zyklus nur dieser
    Box mit Nachdiagnose (wartet einen laufenden Stick-Reset ab und entfaellt, wenn die Box
    danach wieder da ist), 3 Voll-Reparatur mit Add-on-Neustart (hoechstens alle 30 Min, input_datetime.radiostream_letzte_automatische_voll_reparatur),
    4 nur Meldung "bitte manuell pruefen". Jede Stufe setzt den Merker input_boolean.radiostream_ausfall_gemeldet_<p>
    und schickt einen Push mit tag radiostream_<p> (Stufe 1 nur ans eigene Handy, ab Stufe 2 an alle Geraete; ersetzt die vorige Meldung);
    die Entwarnung kommt von automation.radiostream_player_wieder_verfugbar_benachrichtigung_loschen.
    Aenderungsgeschichte bis 21.11.2026: docs/chrischan-ha/historie.md im Repo chrisch4n/ha-bluetooth-audio-manager
    (Branch chrischan). [21.11.2026 Claude, auf Wunsch des Nutzers: Beschreibung gekuerzt. 23.11.2026 Claude, auf Wunsch des Nutzers: Stufe 1 nur ans eigene Handy.]'
  triggers:
  - entity_id:
    - media_player.musik_radiostream_87_5
    - media_player.musik_radiostream_97_0
    - media_player.musik_radiostream_105_9
    for:
      minutes: 3
    id: diagnose
    to: unavailable
    trigger: state
  - entity_id:
    - media_player.musik_radiostream_87_5
    - media_player.musik_radiostream_97_0
    - media_player.musik_radiostream_105_9
    for:
      minutes: 5
    id: steckdosen_zyklus
    to: unavailable
    trigger: state
  - entity_id:
    - media_player.musik_radiostream_87_5
    - media_player.musik_radiostream_97_0
    - media_player.musik_radiostream_105_9
    for:
      minutes: 20
    id: addon_neustart
    to: unavailable
    trigger: state
  - entity_id:
    - media_player.musik_radiostream_87_5
    - media_player.musik_radiostream_97_0
    - media_player.musik_radiostream_105_9
    for:
      minutes: 30
    id: manuell_pruefen
    to: unavailable
    trigger: state
  - trigger: state
    entity_id:
    - binary_sensor.radiostream_87_5_spielt_nicht
    - binary_sensor.radiostream_97_0_spielt_nicht
    - binary_sensor.radiostream_105_9_spielt_nicht
    to: 'on'
    for:
      minutes: 15
    id: diagnose
    note: '11.11.2026 (Claude): Einstieg ''spielt nicht'' - Box aktiv, Steckdose an, Player
      seit 15 Min nicht (stabil) ''playing''. Gleiche id wie die Stufe fuer Ausfaelle, damit
      dieselben Schritte laufen; unterschieden wird ueber die Variable spielt_nicht'
  - trigger: state
    entity_id:
    - binary_sensor.radiostream_87_5_spielt_nicht
    - binary_sensor.radiostream_97_0_spielt_nicht
    - binary_sensor.radiostream_105_9_spielt_nicht
    to: 'on'
    for:
      minutes: 20
    id: steckdosen_zyklus
    note: '11.11.2026 (Claude): Einstieg ''spielt nicht'' - Box aktiv, Steckdose an, Player
      seit 20 Min nicht (stabil) ''playing''. Gleiche id wie die Stufe fuer Ausfaelle, damit
      dieselben Schritte laufen; unterschieden wird ueber die Variable spielt_nicht'
  - trigger: state
    entity_id:
    - binary_sensor.radiostream_87_5_spielt_nicht
    - binary_sensor.radiostream_97_0_spielt_nicht
    - binary_sensor.radiostream_105_9_spielt_nicht
    to: 'on'
    for:
      minutes: 30
    id: addon_neustart
    note: '11.11.2026 (Claude): Einstieg ''spielt nicht'' - Box aktiv, Steckdose an, Player
      seit 30 Min nicht (stabil) ''playing''. Gleiche id wie die Stufe fuer Ausfaelle, damit
      dieselben Schritte laufen; unterschieden wird ueber die Variable spielt_nicht'
  - trigger: state
    entity_id:
    - binary_sensor.radiostream_87_5_spielt_nicht
    - binary_sensor.radiostream_97_0_spielt_nicht
    - binary_sensor.radiostream_105_9_spielt_nicht
    to: 'on'
    for:
      minutes: 40
    id: manuell_pruefen
    note: '11.11.2026 (Claude): Einstieg ''spielt nicht'' - Box aktiv, Steckdose an, Player
      seit 40 Min nicht (stabil) ''playing''. Gleiche id wie die Stufe fuer Ausfaelle, damit
      dieselben Schritte laufen; unterschieden wird ueber die Variable spielt_nicht'
  conditions:
  - condition: template
    value_template: '{{ is_state((states(''input_text.radiostream_aktiv_map'') | from_json)[p],
      ''on'') and is_state((states(''input_text.radiostream_dose_switch_map'') | from_json)[p],
      ''on'') }}'
    note: Nur eingreifen, wenn die Box aktiv ist UND ihre Steckdose an ist - eine absichtlich
      ausgeschaltete Box (Power-Button, Stopp-Schalter) ist kein Ausfall und darf weder repariert
      noch wieder eingeschaltet werden
  - condition: template
    value_template: '{{ not (spielt_nicht and is_state(player, ''unavailable'') and (now()
      - states[player].last_changed).total_seconds() >= 300) }}'
    note: '11.11.2026 (Claude): Einstieg ''spielt nicht'' ueberspringen, solange der Player
      seit mindestens 5 Min durchgehend unavailable ist - dann laeuft bereits die Stufenleiter
      fuer Ausfaelle, zwei Reparaturen gleichzeitig sollen nicht konkurrieren'
  - condition: template
    value_template: '{{ not spielt_nicht or (not is_state(''binary_sensor.internet'', ''off'')
      and not (is_state(''binary_sensor.internet'', ''on'') and (now() - states[''binary_sensor.internet''].last_changed).total_seconds()
      < 300)) }}'
    note: '11.11.2026 (Claude): Einstieg ''spielt nicht'' nur mit Internet (binary_sensor.internet
      an, und zwar seit mindestens 5 Min) - ohne Internet kann kein Stream spielen, Diagnose/Steckdosen-Zyklus/Add-on-Neustart
      wuerden nichts beheben. Ist der Sensor unbekannt, wird nicht gesperrt'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.radiostream_ausfall_gemeldet_{{ p }}
    note: 'Merker: fuer diese Box wurde eine Ausfall-Meldung verschickt - nur dann gibt es
      spaeter eine Entwarnung'
  - if:
    - condition: trigger
      id:
      - diagnose
    then:
    - action: notify.mobile_app_geraet_4
      continue_on_error: true
      data:
        message: 'Stufe {{ {''diagnose'': ''1'', ''steckdosen_zyklus'': ''2'', ''addon_neustart'':
          ''3'', ''manuell_pruefen'': ''4''}[trigger.id] }}/4: {{ box_name }} ({{ player }}) {{
          stoerung }}. {{ {''diagnose'': ''Pruefe per API ob Bluetooth gesund ist - reiche ggf.
          nur die HA-MPD-Integration neu ein, sonst Force-Reconnect.'', ''steckdosen_zyklus'':
          ''Diagnose hat nicht geholfen, zyklisiere gezielt nur die betroffene Steckdose (ohne
          Add-on-Neustart) und pruefe danach erneut.'', ''addon_neustart'': ''Steckdosen-Zyklus
          hat nicht geholfen, eskaliere auf volle Reparatur (Steckdosen-Zyklus + Add-on-Neustart,
          betrifft kurz alle drei Boxen).'', ''manuell_pruefen'': ''Auch die volle Reparatur hat
          nicht geholfen. Bitte manuell pruefen (Strom, Box, Adapter).''}[trigger.id] }}'
        title: '{{ ''Radiostream spielt nicht'' if spielt_nicht else ''Radiostream ausgefallen''
          }}'
        data:
          tag: radiostream_{{ p }}
    else:
    - note: 'Push pro Geraet ueber die Mobile-App-Dienste mit tag radiostream_<player>: gleiche
        Markierung ersetzt die vorige Meldung, pro Box gibt es also immer nur EINE Meldung, die
        sich von Stufe zu Stufe aktualisiert und am Ende durch die Entwarnung ersetzt wird'
      action: script.benachrichtigung_alle_geraete
      data:
        message: 'Stufe {{ {''diagnose'': ''1'', ''steckdosen_zyklus'': ''2'', ''addon_neustart'':
          ''3'', ''manuell_pruefen'': ''4''}[trigger.id] }}/4: {{ box_name }} ({{ player }}) {{
          stoerung }}. {{ {''diagnose'': ''Pruefe per API ob Bluetooth gesund ist - reiche ggf.
          nur die HA-MPD-Integration neu ein, sonst Force-Reconnect.'', ''steckdosen_zyklus'':
          ''Diagnose hat nicht geholfen, zyklisiere gezielt nur die betroffene Steckdose (ohne
          Add-on-Neustart) und pruefe danach erneut.'', ''addon_neustart'': ''Steckdosen-Zyklus
          hat nicht geholfen, eskaliere auf volle Reparatur (Steckdosen-Zyklus + Add-on-Neustart,
          betrifft kurz alle drei Boxen).'', ''manuell_pruefen'': ''Auch die volle Reparatur hat
          nicht geholfen. Bitte manuell pruefen (Strom, Box, Adapter).''}[trigger.id] }}'
        title: '{{ ''Radiostream spielt nicht'' if spielt_nicht else ''Radiostream ausgefallen''
          }}'
        daten:
          tag: radiostream_{{ p }}
      continue_on_error: true
    note: '23.11.2026 (Claude, auf Wunsch des Nutzers): Stufe 1 nur ans eigene Handy (Poco) -
      am 23.11. um 01:45 ging sie nachts an alle 4 Geraete, eine Minute spaeter spielte die Box
      wieder. Ab Stufe 2 an alle Geraete; gleicher tag radiostream_<p>, die Entwarnung ersetzt
      beide.'
  - action: persistent_notification.create
    continue_on_error: true
    data:
      message: 'Stufe {{ {''diagnose'': ''1'', ''steckdosen_zyklus'': ''2'', ''addon_neustart'':
        ''3'', ''manuell_pruefen'': ''4''}[trigger.id] }}/4: {{ box_name }} ({{ player }})
        {{ stoerung }}.'
      notification_id: radiostream_ausfall_musik_radiostream_{{ p }}
      title: '{{ ''Radiostream spielt nicht'' if spielt_nicht else ''Radiostream ausgefallen''
        }}'
  - choose:
    - conditions:
      - condition: trigger
        id:
        - diagnose
      sequence:
      - action: script.turn_on
        data:
          variables:
            player: '{{ p }}'
        note: 'Schnellste Stufe: prueft per API ob BT gesund ist, reicht ggf. nur die MPD-Integration
          neu ein oder delegiert intern an Force-Reconnect'
        target:
          entity_id: script.radiostream_reparieren_ultralight
    - conditions:
      - condition: trigger
        id:
        - steckdosen_zyklus
      sequence:
      - if:
        - condition: state
          entity_id: script.radiostream_stick_zuruecksetzen
          state: 'on'
        then:
        - wait_template: '{{ is_state(''script.radiostream_stick_zuruecksetzen'', ''off'')
            }}'
          timeout:
            minutes: 8
          continue_on_timeout: true
        - delay:
            seconds: 30
        - if:
          - condition: template
            value_template: '{{ is_state(player, ''playing'') if spielt_nicht else not is_state(player,
              ''unavailable'') }}'
          then:
          - stop: Box ist nach dem Stick-Reset wieder da - kein Steckdosen-Zyklus noetig
        note: '13.11.2026 (Claude): Laeuft gerade der Stick-Reset (script.radiostream_stick_zuruecksetzen,
          startet automatisch je Stick, wenn alle Boxen eines Sticks 4 Min ohne Verbindung
          sind), erst dessen Ende abwarten - ein Steckdosen-Zyklus mitten im einzelnen Neuverbinden
          der Boxen wuerde stoeren. Ist die Box danach wieder da, entfaellt der Zyklus.'
      - action: script.turn_on
        data:
          variables:
            player: '{{ p }}'
        note: Reiner Steckdosen-Zyklus OHNE Add-on-Neustart - stoert die anderen beiden Boxen
          nicht
        target:
          entity_id: script.radiostream_steckdose_zyklieren
      - delay:
          seconds: 2
      - wait_template: '{{ is_state(''script.radiostream_steckdose_zyklieren'', ''off'') }}'
        timeout:
          seconds: 90
        continue_on_timeout: true
        note: Auf das Ende des Steckdosen-Zyklus warten (30s stromlos + Einschalten)
      - delay:
          seconds: 60
        note: Der Box Zeit zum Booten und Neuverbinden geben
      - if:
        - condition: template
          value_template: '{{ (not is_state(player, ''playing'')) if spielt_nicht else is_state(player,
            ''unavailable'') }}'
        then:
        - action: script.turn_on
          target:
            entity_id: script.radiostream_reparieren_ultralight
          data:
            variables:
              player: '{{ p }}'
        note: 'Nachdiagnose: Ist die Box nach dem Steckdosen-Zyklus wieder per Bluetooth da,
          fehlt oft nur der MPD-Dienst (Add-on startet ihn nach verzoegertem Reconnect nicht
          mit, 25.09.2026 bei 87.5 beobachtet). Die Diagnose behebt das in Sekunden - statt
          15 Minuten auf die Voll-Reparatur (Stufe 3) zu warten, die alle drei Boxen unterbricht.
          Laeuft der Player bereits wieder, entfaellt sie (keine unnoetige Sink-Abfrage).'
    - conditions:
      - condition: trigger
        id:
        - addon_neustart
      sequence:
      - if:
        - condition: template
          value_template: '{{ now().timestamp() - (state_attr(''input_datetime.radiostream_letzte_automatische_voll_reparatur'',
            ''timestamp'') | float(0)) > 1800 }}'
        then:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.radiostream_letzte_automatische_voll_reparatur
          data:
            timestamp: '{{ now().timestamp() }}'
        - action: script.turn_on
          data:
            variables:
              player: '{{ p }}'
          note: 'Eskalation: Steckdosen-Zyklus hat nicht geholfen - volle Reparatur inkl.
            Add-on-Neustart'
          target:
            entity_id: script.radiostream_reparieren
        else:
        - action: script.benachrichtigung_alle_geraete
          continue_on_error: true
          data:
            title: 'Radiostream: Eskalation gesperrt'
            message: 'Stufe 3/4: {{ box_name }}: automatische Voll-Reparatur uebersprungen
              - innerhalb der letzten 30 Minuten lief bereits eine. Bitte manuell pruefen.'
            daten:
              tag: radiostream_{{ p }}
          note: '06.11.2026 (Claude): wie die uebrigen Meldungen ueber script.benachrichtigung_alle_geraete
            mit tag radiostream_<player> - ersetzt die Stufe-3-Meldung und wird spaeter von
            der Entwarnung ersetzt'
        note: 'Sperrzeit 30 Min: verhindert eine Schleife aus Voll-Reparatur -> gleichzeitiger
          Reconnect -> Mixing -> erneute Voll-Reparatur'
  max: 10
  mode: parallel
  variables:
    p: '{{ trigger.entity_id | regex_findall_index(''[0-9]+_[0-9]+'') }}'
    player: media_player.musik_radiostream_{{ p }}
    spielt_nicht: '{{ trigger.entity_id.startswith(''binary_sensor.'') }}'
    box_name: '{{ state_attr(player, ''friendly_name'') or player }}'
    stoerung: '{% set m = {''diagnose'': [3, 15], ''steckdosen_zyklus'': [5, 20], ''addon_neustart'':
      [20, 30], ''manuell_pruefen'': [30, 40]}[trigger.id] %}{{ (''spielt seit über '' ~ m[1]
      ~ '' Minuten nicht'') if spielt_nicht else (''ist seit über '' ~ m[0] ~ '' Minuten unavailable'')
      }}'
- id: '1786706796964'
  alias: Radiostream Player wieder verfügbar (Benachrichtigung löschen)
  description: 'Entwarnung nach einem gemeldeten Ausfall: Ein Player kommt aus unavailable
    zurueck (20 s stabil) oder binary_sensor.radiostream_<p>_spielt_nicht geht aus (Player
    spielt 90 s durchgehend). Nur wenn der Merker input_boolean.radiostream_ausfall_gemeldet_<p>
    an ist, also wirklich eine Ausfall-Meldung verschickt wurde: Merker aus, persistente Meldung
    loeschen, Push an alle Geraete mit Ausfalldauer und gleichem Tag (radiostream_<p>), der
    die Ausfall-Meldung ersetzt. Kurze Aussetzer ohne Meldung loesen nichts aus. Aenderungsgeschichte
    bis 21.11.2026: docs/chrischan-ha/historie.md im Repo chrisch4n/ha-bluetooth-audio-manager
    (Branch chrischan). [21.11.2026 Claude, auf Wunsch des Nutzers: Beschreibung gekuerzt.]'
  triggers:
  - entity_id:
    - media_player.musik_radiostream_87_5
    - media_player.musik_radiostream_97_0
    - media_player.musik_radiostream_105_9
    for:
      seconds: 20
    from: unavailable
    not_to:
    - unavailable
    - unknown
    trigger: state
  - trigger: state
    entity_id:
    - binary_sensor.radiostream_87_5_spielt_nicht
    - binary_sensor.radiostream_97_0_spielt_nicht
    - binary_sensor.radiostream_105_9_spielt_nicht
    from: 'on'
    to: 'off'
    id: spielt_wieder
    note: '11.11.2026 (Claude): Entwarnung fuer den Einstieg ''spielt nicht'' des Bug-Watch
      - der Helfer geht aus, sobald der Player 90 s durchgehend spielt. Ohne gesetzten Merker
      passiert nichts (z.B. wenn die Entwarnung nach einem Ausfall schon ueber den ersten
      Ausloeser lief)'
  actions:
  - variables:
      dauer: '{{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed))
        / 60) | round(0) | int }}'
      label: '{{ (trigger.entity_id | regex_findall_index(''[0-9]+_[0-9]+'')).replace(''_'',
        ''.'') }}'
      merker: '{{ ''input_boolean.radiostream_ausfall_gemeldet_'' ~ (trigger.entity_id | regex_findall_index(''[0-9]+_[0-9]+''))
        }}'
      p: '{{ (trigger.entity_id | regex_findall_index(''[0-9]+_[0-9]+'')) }}'
  - condition: template
    note: Nur wenn fuer diese Box wirklich eine Ausfall-Meldung verschickt wurde - sonst keine
      Entwarnung (kein Spam bei kurzen Aussetzern)
    value_template: '{{ is_state(merker, ''on'') }}'
  - action: input_boolean.turn_off
    target:
      entity_id: '{{ merker }}'
  - action: persistent_notification.dismiss
    continue_on_error: true
    data:
      notification_id: radiostream_ausfall_musik_radiostream_{{ p }}
  - condition: template
    value_template: '{{ trigger.id != ''spielt_wieder'' or is_state(''media_player.musik_radiostream_''
      ~ p, ''playing'') }}'
    note: '11.11.2026 (Claude): Beim Ausloeser ''spielt_wieder'' nur dann ''laeuft wieder''
      melden, wenn der Player wirklich spielt. Geht der Helfer aus, weil die Box ausgeschaltet
      oder deaktiviert wurde, sind Merker und persistente Meldung bereits zurueckgesetzt,
      eine Entwarnung waere aber falsch'
  - note: Gleiche Markierung wie die Ausfall-Meldung des Watchdogs - ersetzt sie auf dem Handy,
      statt eine weitere Meldung hinzuzufuegen
    action: script.benachrichtigung_alle_geraete
    data:
      message: '{{ label }} läuft wieder (Ausfall ca. {{ dauer }} Min).'
      title: Radiostream wieder da
      daten:
        tag: radiostream_{{ p }}
    continue_on_error: true
  max: 10
  mode: parallel
- id: '1787286971104'
  alias: Radiostream permanent (97.0/105.9/87.5)
  description: 'Spielt je Box den gewaehlten Sender (select.radiosender_<p>) dauerhaft ueber
    MPD, solange input_boolean.radiostream_<p>_aktiv an ist. HA-Start, 5-Min-Watchdog und manuelles
    Ausloesen pruefen alle aktiven Boxen und starten neu, wenn eine nicht spielt, ihre Position
    steht oder ein falscher Sender laeuft. Senderwechsel, Aktivierung, Rueckkehr aus unavailable
    und Stopp (je 20 s stabil) betreffen nur die eine Box. Mixing-Schutz: zwischen Starts verschiedener
    Boxen 3 s Abstand (input_text.radiostream_letzter_start). Modus queued. Die Boxen kommen
    aus input_text.radiostream_address_map; die Ausloeser sind je Box eingetragen. Aenderungsgeschichte
    bis 21.11.2026: docs/chrischan-ha/historie.md im Repo chrisch4n/ha-bluetooth-audio-manager
    (Branch chrischan). [21.11.2026 Claude, auf Wunsch des Nutzers: Beschreibung gekuerzt, 30
    Traces statt 5, Boxenliste aus der address_map. 25.11.2026 Claude, auf Wunsch des Nutzers:
    Start nur mit Stream-Adresse.]'
  triggers:
  - event: start
    id: ha_start
    trigger: homeassistant
  - id: watchdog
    minutes: /5
    trigger: time_pattern
  - entity_id:
    - select.radiosender_97_0
    id: sender_gewechselt_97_0
    trigger: state
    to: null
    note: 'to: null = nur echte Zustandswechsel (anderer Sender), keine Attributaenderungen.
      not_from: kein Ausloesen, wenn der Template-Select beim Start/Neuladen erst seinen Wert
      bekommt (18.11.2026)'
    not_from:
    - unknown
    - unavailable
  - entity_id:
    - select.radiosender_105_9
    id: sender_gewechselt_105_9
    trigger: state
    to: null
    note: 'to: null = nur echte Zustandswechsel (anderer Sender), keine Attributaenderungen.
      not_from: kein Ausloesen, wenn der Template-Select beim Start/Neuladen erst seinen Wert
      bekommt (18.11.2026)'
    not_from:
    - unknown
    - unavailable
  - entity_id:
    - select.radiosender_87_5
    id: sender_gewechselt_87_5
    trigger: state
    to: null
    note: 'to: null = nur echte Zustandswechsel (anderer Sender), keine Attributaenderungen.
      not_from: kein Ausloesen, wenn der Template-Select beim Start/Neuladen erst seinen Wert
      bekommt (18.11.2026)'
    not_from:
    - unknown
    - unavailable
  - entity_id:
    - input_boolean.radiostream_97_0_aktiv
    id: aktiviert_97_0
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.radiostream_105_9_aktiv
    id: aktiviert_105_9
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.radiostream_87_5_aktiv
    id: aktiviert_87_5
    to: 'on'
    trigger: state
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_97_0
    from: unavailable
    not_to:
    - unavailable
    - unknown
    for:
      seconds: 20
    id: zurueck_97_0
    note: '06.11.2026 (Claude): Player meldet sich nach einem Ausfall zurueck (Reparatur, Steckdosen-Zyklus,
      Add-on-Neustart oder -Update) - nur DIESER Player wird geprueft und bei Bedarf gestartet,
      statt bis zum naechsten 5-Min-Watchdog zu warten'
  - trigger: state
    entity_id:
    - media_player.musik_radiostream_105_9
    from: unavailable
    not_to:
    - unavailable
    - unknown
    for:
      seconds: 20
    id: zurueck_105_9
    note: '06.11.2026 (Claude): Player meldet sich nach einem Ausfall zurueck (Reparatur, Steckdosen-Zyklus,
      Add-on-Neustart oder -Update) - nur DIESER Player wird geprueft und bei Bedarf gestartet,
