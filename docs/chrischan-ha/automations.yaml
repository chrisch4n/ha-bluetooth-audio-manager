- id: '1790922426090'
  alias: Radiostream Player nach HA-Start prüfen
  description: 'Schliesst die Luecke von Bug-Watch und Entwarnung, die beide einen Zustandswechsel
    brauchen: 3 Minuten nach dem HA-Start wird jede Box einmal geprueft, nacheinander. (a)
    Seit dem Start unavailable, aktiv und Steckdose an: Merker setzen, Push, einmal die Diagnose;
    ist die Box laut Add-on danach per Bluetooth getrennt, einmal der Steckdosen-Zyklus mit
    Nachdiagnose. Keine weitere Eskalation (kein Add-on- oder HA-Neustart), damit keine Schleife
    entsteht. (b) Merker an, Box wieder da: Entwarnung nachholen. Die Boxen kommen aus input_text.radiostream_address_map.
    Aenderungsgeschichte bis 21.11.2026: docs/chrischan-ha/historie.md im Repo chrisch4n/ha-bluetooth-audio-manager
    (Branch chrischan). [21.11.2026 Claude, auf Wunsch des Nutzers: Beschreibung gekuerzt,
    Boxenliste aus der address_map.]'
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - delay: 00:03:05
    note: 'Etwas mehr als 3 Minuten: so lange brauchen Add-on und Boxen maximal zum Neuverbinden;
      die 180-s-Pruefung unten erkennt damit sicher ''seit dem Start weg''.'
  - repeat:
      for_each: '{{ states(''input_text.radiostream_address_map'') | from_json | list }}'
      sequence:
      - variables:
          aktiv_ok: '{{ is_state((states(''input_text.radiostream_aktiv_map'') | from_json)[repeat.item],
            ''on'') and is_state((states(''input_text.radiostream_dose_switch_map'') | from_json)[repeat.item],
            ''on'') }}'
          e: media_player.musik_radiostream_{{ repeat.item }}
          label: '{{ repeat.item.replace(''_'', ''.'') }}'
          merker: input_boolean.radiostream_ausfall_gemeldet_{{ repeat.item }}
          seit_start_weg: '{{ states[e] is not none and is_state(e, ''unavailable'') and (now()
            - states[e].last_changed).total_seconds() >= 180 }}'
          wieder_da: '{{ states[e] is not none and states(e) not in [''unavailable'', ''unknown'']
            and (now() - states[e].last_changed).total_seconds() >= 20 }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ aktiv_ok and seit_start_weg }}'
          sequence:
          - action: input_boolean.turn_on
            note: Merker setzen, damit die normale Entwarnung greift, sobald die Box zurueckkommt
            target:
              entity_id: '{{ merker }}'
          - action: script.benachrichtigung_alle_geraete
            data:
              message: '{{ label }} ist seit dem HA-Start nicht erreichbar. Die Diagnose läuft
                jetzt. Ist die Box danach per Bluetooth weiter getrennt, wird einmalig ihre
                Steckdose aus- und eingeschaltet und erneut geprüft. Kommt sie auch dann nicht
                zurück, bitte manuell prüfen (Kopplungsmodus, Adapter).'
              title: Radiostream ausgefallen
              daten:
                tag: radiostream_{{ repeat.item }}
            continue_on_error: true
          - action: script.turn_on
            continue_on_error: true
            data:
              variables:
                player: '{{ repeat.item }}'
            target:
              entity_id: script.radiostream_reparieren_ultralight
          - delay:
              seconds: 2
          - continue_on_timeout: true
            note: Auf das Ende der Diagnose warten, bevor der naechste Player geprueft wird
              - keine gleichzeitigen Bluetooth-Aktionen
            timeout:
              seconds: 90
            wait_template: '{{ is_state(''script.radiostream_reparieren_ultralight'', ''off'')
              }}'
          - wait_template: '{{ is_state(''script.radiostream_reparieren_ultralight'', ''off'')
              and is_state(''script.radiostream_reparieren_light'', ''off'') and is_state(''script.radiostream_mpd_sicherstellen'',
              ''off'') }}'
            timeout:
              seconds: 180
            continue_on_timeout: true
            note: '06.10.2026: Die Diagnose kann mit ihren Wiederholungen laenger als die
              90 s oben laufen - vor dem Steckdosen-Zyklus sicher abwarten, bis alle drei
              Reparatur-Skripte fertig sind'
          - action: rest_command.bt_audio_get_devices
            response_variable: geraete
            continue_on_error: true
            note: '06.10.2026: Nur Bluetooth-Geraete abfragen (keine Sink-Abfrage, kein Stocken)
              - entscheidet, ob ein Steckdosen-Zyklus ueberhaupt sinnvoll ist'
          - variables:
              bt_getrennt: '{% set liste = geraete.content.devices if (geraete is defined
                and geraete.content is defined and geraete.content.devices is defined) else
                [] %}{% set d = liste | selectattr(''address'', ''equalto'', (states(''input_text.radiostream_address_map'')
                | from_json)[repeat.item]) | list | first %}{{ d is defined and d is not none
                and not d.connected }}'
            note: Wahr nur, wenn das Add-on die Box kennt UND sie als getrennt meldet. Abfrage
              fehlgeschlagen oder Box unbekannt -> falsch -> kein Zyklus
          - if:
            - condition: template
              value_template: '{{ is_state(e, ''unavailable'') and bt_getrennt and is_state((states(''input_text.radiostream_aktiv_map'')
                | from_json)[repeat.item], ''on'') and is_state((states(''input_text.radiostream_dose_switch_map'')
                | from_json)[repeat.item], ''on'') and is_state(''script.radiostream_reparieren_ultralight'',
                ''off'') and is_state(''script.radiostream_reparieren_light'', ''off'') }}'
            then:
            - action: script.benachrichtigung_alle_geraete
              continue_on_error: true
              data:
                message: '{{ label }}: Die Diagnose hat nicht geholfen, die Box ist per Bluetooth
                  weiter getrennt. Schalte einmalig ihre Steckdose aus und wieder ein und
                  prüfe danach erneut.'
                title: Radiostream ausgefallen
                daten:
                  tag: radiostream_{{ repeat.item }}
            - action: script.turn_on
              continue_on_error: true
              target:
                entity_id: script.radiostream_steckdose_zyklieren
              data:
                variables:
                  player: '{{ repeat.item }}'
              note: Reiner Steckdosen-Zyklus OHNE Add-on-Neustart - stoert die anderen beiden
                Boxen nicht
            - delay:
                seconds: 2
            - wait_template: '{{ is_state(''script.radiostream_steckdose_zyklieren'', ''off'')
                }}'
              timeout:
                seconds: 90
              continue_on_timeout: true
              note: Auf das Ende des Steckdosen-Zyklus warten (30s stromlos + Einschalten)
            - delay:
                seconds: 60
              note: Der Box Zeit zum Booten und Neuverbinden geben
            - if:
              - condition: template
                value_template: '{{ is_state(e, ''unavailable'') }}'
              then:
              - action: script.turn_on
                continue_on_error: true
                target:
                  entity_id: script.radiostream_reparieren_ultralight
                data:
                  variables:
                    player: '{{ repeat.item }}'
              - delay:
                  seconds: 2
              - wait_template: '{{ is_state(''script.radiostream_reparieren_ultralight'',
                  ''off'') }}'
                timeout:
                  seconds: 180
                continue_on_timeout: true
                note: Auf das Ende der Nachdiagnose warten, bevor der naechste Player geprueft
                  wird
              note: 'Nachdiagnose wie in Stufe 2 des Watchdogs: verbindet die Box neu und
                startet bei Bedarf den MPD-Dienst nach'
            note: '06.10.2026: EINMAL pro HA-Start und Box - nur wenn der Player noch unavailable
              ist, die Box laut Add-on per Bluetooth getrennt ist, sie aktiv ist, ihre Steckdose
              an ist und keine Reparatur mehr laeuft. Keine weitere Eskalation (kein Add-on-
              oder HA-Neustart)'
        - conditions:
          - condition: template
            value_template: '{{ is_state(merker, ''on'') and wieder_da }}'
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: '{{ merker }}'
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: radiostream_ausfall_musik_radiostream_{{ repeat.item }}
          - action: script.benachrichtigung_alle_geraete
            data:
              message: '{{ label }} ist nach dem HA-Neustart wieder erreichbar.'
              title: Radiostream wieder da
              daten:
                tag: radiostream_{{ repeat.item }}
            continue_on_error: true
  mode: single
- id: '1793650190393'
  alias: Radiostream Lautstärke-Sperre an Add-on übertragen
  description: 'Überträgt den Schalter input_boolean.radiostream_lautstarke_fest_100 an das
    gepatchte BT-Audio-Add-on (Einstellung volume_lock je Box, ab 2.1.0-cc.6): an = Lautstärke
    gesperrt, aus = normale Lautstärkeregelung. Läuft bei jedem Umschalten und beim HA-Start
    (Abgleich, falls das Add-on einen anderen Stand hat). Boxen kommen aus input_text.radiostream_address_map.
    Angelegt 02.11.2026 von Claude. [07.11.2026 Claude, auf Wunsch des Nutzers: Sperr-Wert
    einstellbar statt fest 100 % (Add-on ab 2.1.0-cc.16, App-Einstellung volume_lock_level).
    input_number.radiostream_lautstarke_alle_boxen (10-100 %) wird bei jeder Änderung und
    beim HA-Start per rest_command.bt_audio_put_settings an das Add-on gegeben, immer vor
    dem Sperr-Schalter. Der Wert wirkt auf die MPD-Lautstärke aller gesperrten Boxen; Stream
    und Box bleiben auf 100 %. Unter 100 % hilft er, wenn die UKW-Sender bei vollem Pegel
    übersteuern. Eine reine Wert-Änderung schickt den Sperr-Schalter nicht erneut.]'
  triggers:
  - entity_id: input_boolean.radiostream_lautstarke_fest_100
    id: geschaltet
    to:
    - 'on'
    - 'off'
    trigger: state
  - entity_id: input_number.radiostream_lautstarke_alle_boxen
    id: stufe
    not_to:
    - unavailable
    - unknown
    trigger: state
  - event: start
    id: ha_start
    trigger: homeassistant
  conditions: []
  actions:
  - variables:
      adressen: '{{ (states(''input_text.radiostream_address_map'') | from_json).values()
        | list }}'
      sperre: '{{ is_state(''input_boolean.radiostream_lautstarke_fest_100'', ''on'') }}'
      stufe: '{{ states(''input_number.radiostream_lautstarke_alle_boxen'') | int(100) }}'
  - action: rest_command.bt_audio_put_settings
    continue_on_error: true
    data:
      payload: '{"volume_lock_level": {{ stufe }}}'
    note: Wert zuerst, damit eine im selben Lauf eingeschaltete Sperre gleich auf diesem Wert
      startet
    response_variable: antwort_stufe
  - if:
    - condition: trigger
      id:
      - geschaltet
      - ha_start
    note: Nur bei Umschalten und HA-Start; eine reine Wert-Änderung lässt den Sperr-Schalter
      unberührt
    then:
    - repeat:
        for_each: '{{ adressen }}'
        sequence:
        - action: rest_command.bt_audio_set_volume_lock
          continue_on_error: true
          data:
            address: '{{ repeat.item }}'
            lock: '{{ sperre }}'
          note: Fehler bei einer Box (z. B. Add-on startet gerade) halten die anderen nicht
            auf; das Add-on speichert die Einstellung selbst dauerhaft.
  mode: restart
- id: '1794552641256'
  alias: Radiostream Stick-Reset je Stick
  description: '13.11.2026 (Claude, auf Wunsch des Nutzers): Automatischer Stick-Reset ueber
    script.radiostream_stick_zuruecksetzen mit Stufe ''auto'' (erst Adapter aus/an, bei Bedarf
    USB-Reset wie Abziehen und Einstecken). Laeuft vor dem Steckdosen-Zyklus des Bug-Watch
    (5 Min); der wartet, bis der Stick-Reset fertig ist, und zykliert nur Boxen, die danach
    noch fehlen. Nicht waehrend einer Voll-Reparatur, eines Steckdosen-Zyklus aller Boxen
    oder des Stick-Resets selbst; hoechstens einmal in 30 Minuten (letzter Lauf des Skripts,
    auch manuell). Anlass: Der Stick hing am 11.11. und 13.11.2026, nur Abziehen half. 18.11.2026
    (Claude, auf Wunsch des Nutzers): je Stick statt Boxen-Zaehler - ausgeloest, wenn sensor.radiostream_sticks_ohne_verbindung
    seit 4 Minuten einen oder mehrere Sticks nennt (alle aktiven Boxen dieses Sticks mit eingeschalteter
    Steckdose ohne Verbindung); zurueckgesetzt wird nur der genannte Stick, bei mehreren alle.'
  triggers:
  - trigger: state
    entity_id: sensor.radiostream_sticks_ohne_verbindung
    not_to:
    - keine
    - unknown
    - unavailable
    for:
      minutes: 4
  conditions:
  - condition: state
    entity_id:
    - script.radiostream_stick_zuruecksetzen
    - script.radiostream_reparieren
    - script.radiostream_steckdosen_alle_zyklieren
    note: Nicht in eine laufende Reparatur oder einen laufenden Zyklus hinein
    state: 'off'
  - condition: template
    note: Hoechstens ein Stick-Reset in 30 Minuten (auch ein manueller zaehlt) - verhindert
      eine Schleife, wenn es nicht am Stick liegt
    value_template: '{{ now() - (state_attr(''script.radiostream_stick_zuruecksetzen'', ''last_triggered'')
      or (now() - timedelta(days=1))) > timedelta(minutes=30) }}'
  actions:
  - action: script.turn_on
    data:
      variables:
        stufe: auto
        sticks: '{{ trigger.to_state.state }}'
        ausloeser: automatisch, {{ trigger.to_state.state }} seit 4 Min ohne Verbindung
    target:
      entity_id: script.radiostream_stick_zuruecksetzen
  max_exceeded: silent
  mode: single
- id: '1795293887000'
  alias: 'Radiostream Bitrate unten: BT-Reconnect'
  description: 'Absicherung zum Add-on (ab cc.30 verbindet das Add-on selbst eine spielende
    Box neu, die 5 Minuten auf der untersten SBC-Bitrate haengt, hoechstens einmal in 30 Minuten).
    Haengt eine Box trotzdem 40 Minuten unten (binary_sensor.radiostream_<p>_bitrate_unten),
    verbindet diese Automation sie per rest_command.bt_audio_force_reconnect neu, stellt danach
    den MPD-Dienst sicher (script.radiostream_mpd_sicherstellen) und schickt einen Push an das
    eigene Handy (tag radiostream_bitrate). Zusaetzlich alle 15 Minuten eine Pruefung, falls
    der Sensor ohne Wechsel schon an war. Nicht waehrend Voll-Reparatur, Stick-Reset oder Zyklus
    aller Boxen; hoechstens einmal in 30 Minuten. 30 Traces. Boxen aus input_text.radiostream_address_map.
    [21.11.2026 Claude, auf Wunsch des Nutzers angelegt; am selben Abend auf 40 Minuten als
    Absicherung umgestellt, nachdem das Add-on das selbst uebernimmt. 25.11.2026 Claude, auf
    Wunsch des Nutzers: Push auch ohne Antwort des Add-ons.]'
  triggers:
  - trigger: state
    entity_id: binary_sensor.radiostream_87_5_bitrate_unten
    to: 'on'
    for:
      minutes: 40
    id: '87_5'
  - trigger: state
    entity_id: binary_sensor.radiostream_97_0_bitrate_unten
    to: 'on'
    for:
      minutes: 40
    id: '97_0'
  - trigger: state
    entity_id: binary_sensor.radiostream_105_9_bitrate_unten
    to: 'on'
    for:
      minutes: 40
    id: '105_9'
  - trigger: time_pattern
    minutes: /15
    id: pruefen
    note: Faengt den Fall ab, dass die Box schon beim Anlegen/Neustart auf der untersten Stufe
      stand (der Sensor stellt seinen Zustand wieder her, ohne Wechsel nach an)
  conditions:
  - condition: template
    value_template: '{% set ns = namespace(ok=false) %}{% for p in (states(''input_text.radiostream_address_map'')
      | from_json(default={})).keys() %}{% set e = ''binary_sensor.radiostream_'' ~ p ~ ''_bitrate_unten''
      %}{% if is_state(e, ''on'') and now() - states[e].last_changed > timedelta(minutes=40)
      %}{% set ns.ok = true %}{% endif %}{% endfor %}{{ trigger.id != ''pruefen'' or ns.ok }}'
    note: Die 15-Minuten-Pruefung laeuft nur weiter, wenn eine Box seit 40 Minuten auf der untersten
      Stufe steht - sonst wuerde jeder Pruefdurchlauf last_triggered setzen und die 30-Minuten-Sperre
      dauerhaft blockieren
  - condition: state
    entity_id:
    - script.radiostream_reparieren
    - script.radiostream_stick_zuruecksetzen
    - script.radiostream_steckdosen_alle_zyklieren
    state: 'off'
    note: Nicht in eine laufende Reparatur hinein
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or now() - this.attributes.last_triggered
      > timedelta(minutes=30) }}'
    note: Hoechstens ein Reconnect in 30 Minuten - bleibt die Verbindung zu schwach, faellt
      die Bitrate sofort wieder
  actions:
  - variables:
      player: '{% set ns = namespace(p='''') %}{% for p in (states(''input_text.radiostream_address_map'')
        | from_json(default={})).keys() %}{% set e = ''binary_sensor.radiostream_'' ~ p ~ ''_bitrate_unten''
        %}{% if not ns.p and is_state(e, ''on'') and now() - states[e].last_changed > timedelta(minutes=40)
        %}{% set ns.p = p %}{% endif %}{% endfor %}{{ trigger.id if trigger.id != ''pruefen''
        else ns.p }}'
  - if:
    - condition: template
      value_template: '{{ player == '''' }}'
    then:
    - stop: Keine Box seit 40 Minuten auf der untersten Bitrate
  - variables:
      label: '{{ player | replace(''_'', ''.'') }}'
      mac: '{{ (states(''input_text.radiostream_address_map'') | from_json)[player] }}'
      frames: '{{ state_attr(''binary_sensor.radiostream_'' ~ player ~ ''_bitrate_unten'', ''sbc_frames_per_packet'')
        }}'
  - action: rest_command.bt_audio_force_reconnect
    data:
      address: '{{ mac }}'
    response_variable: antwort
    continue_on_error: true
  - delay:
      seconds: 30
    note: Box verbindet sich neu, das Add-on startet den MPD-Dienst danach meist selbst
  - action: script.turn_on
    target:
      entity_id: script.radiostream_mpd_sicherstellen
    data:
      variables:
        player: '{{ player }}'
  - variables:
      status: '{{ antwort.status if (antwort is defined and antwort is mapping) else 0 }}'
    note: '25.11.2026 (Claude, auf Wunsch des Nutzers): Ohne Antwort des Add-ons (Zeitueberschreitung)
      gibt es keine Variable antwort - am 21.11. brach der Push daran ab (UndefinedError).'
  - action: notify.mobile_app_geraet_4
    continue_on_error: true
    data:
      title: 'Radiostream: {{ label }} neu verbunden'
      message: '{{ label }} hing seit 40 Minuten auf der untersten Bitrate ({{ frames }} Frames
        pro Paket, UKW rauscht). Das Add-on hat sie nicht selbst neu verbunden, deshalb hat
        HA Bluetooth neu verbunden{{ '''' if status == 200 else '' - keine Bestaetigung vom
        Add-on ('' ~ ((''HTTP '' ~ status) if status else ''keine Antwort'') ~ '')'' }}.'
      data:
        tag: radiostream_bitrate
    note: Nur an das eigene Handy (21.11.2026) - Ausfallmeldungen gehen weiter an alle Geraete
  mode: single
  max_exceeded: silent
  trace:
    stored_traces: 30
