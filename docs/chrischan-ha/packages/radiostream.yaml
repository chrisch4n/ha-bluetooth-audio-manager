  # Bitrate-Waechter, angelegt 21.11.2026 von Claude auf Wunsch des Nutzers. Das Add-on leitet aus
  # PulseAudio ab, wie weit der SBC-Bitpool je Box gesenkt ist (sbc_frames_per_packet: 5-7 = volle
  # Bitrate, 15 = unterste Stufe). Auf der untersten Stufe rauscht der UKW-Sender; ein Bluetooth-
  # Neuverbinden behebt das (Automation "Radiostream Bitrate unten: BT-Reconnect").
  # Alle 5 Minuten; am 21.11.2026 gemessen: die Abfrage stoert laufende Streams nicht (Gap-Monitor).
  # an = Box haengt auf der untersten Stufe; aus = volle Bitrate oder Box nicht verbunden.
  - triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: rest_command.bt_audio_pulse_bluetooth
        response_variable: pb
        continue_on_error: true
      - variables:
          sinks: "{{ pb.content.sinks if (pb is defined and pb.status == 200 and pb.content is mapping) else [] }}"
          macs: "{{ states('input_text.radiostream_address_map') | from_json(default={}) }}"
    binary_sensor:
      - name: "Radiostream 87.5 Bitrate unten"
        unique_id: radiostream_87_5_bitrate_unten
        device_class: problem
        state: "{% set s = sinks | selectattr('sink', 'search', macs.get('87_5', '-') | replace(':', '_')) | list %}{{ s | count > 0 and s[0].at_lowest_step }}"
        attributes:
          sbc_frames_per_packet: "{% set s = sinks | selectattr('sink', 'search', macs.get('87_5', '-') | replace(':', '_')) | list %}{{ s[0].sbc_frames_per_packet if s else none }}"
      - name: "Radiostream 97.0 Bitrate unten"
        unique_id: radiostream_97_0_bitrate_unten
        device_class: problem
        state: "{% set s = sinks | selectattr('sink', 'search', macs.get('97_0', '-') | replace(':', '_')) | list %}{{ s | count > 0 and s[0].at_lowest_step }}"
        attributes:
          sbc_frames_per_packet: "{% set s = sinks | selectattr('sink', 'search', macs.get('97_0', '-') | replace(':', '_')) | list %}{{ s[0].sbc_frames_per_packet if s else none }}"
      - name: "Radiostream 105.9 Bitrate unten"
        unique_id: radiostream_105_9_bitrate_unten
        device_class: problem
        state: "{% set s = sinks | selectattr('sink', 'search', macs.get('105_9', '-') | replace(':', '_')) | list %}{{ s | count > 0 and s[0].at_lowest_step }}"
        attributes:
          sbc_frames_per_packet: "{% set s = sinks | selectattr('sink', 'search', macs.get('105_9', '-') | replace(':', '_')) | list %}{{ s[0].sbc_frames_per_packet if s else none }}"
