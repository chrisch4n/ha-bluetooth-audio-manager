command_line:
  # Bluetooth-Verbindungsqualitaet der Radiostream-Boxen, ohne Scan (stoert die Streams nicht).
  # Angelegt 18.11.2026 von Claude. Skript: /config/cli/bt_link_quality.py, laeuft in HA Core
  # (Host-Netzwerk; im Add-on gibt es keine Bluetooth-Sockets). Alle 2 Minuten.
  # Zustand: Anzahl der Boxen mit Messwert, "Fehler" wenn das Skript scheitert.
  # Attribute je Box: rssi (dB ausserhalb des "golden range": 0 = gut, negativ = schwaecher),
  # tx / tx_max (Sendeleistung des Sticks in dBm), adapter (MAC des Sticks); null = nicht verbunden.
  - sensor:
      name: "Radiostream BT-Signal"
      unique_id: radiostream_bt_signal
      command: >-
        python3 /config/cli/bt_link_quality.py '{{ states("input_text.radiostream_address_map") }}'
      scan_interval: 120
      command_timeout: 15
      icon: m3o:network-check
      value_template: >-
        {% if value_json is mapping and 'error' not in value_json %}{{ value_json.values() | select('mapping') | list | count }}{% else %}Fehler{% endif %}
      json_attributes:
        - "87_5"
        - "97_0"
        - "105_9"
        - error

rest_command:
  bt_audio_health:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/health"
    method: GET

  bt_audio_forget_device:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/forget"
    method: POST
    content_type: "application/json"
    payload: '{"address": "{{ address }}"}'

  bt_audio_force_reconnect:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/force-reconnect"
    method: POST
    content_type: "application/json"
    payload: '{"address": "{{ address }}"}'

  bt_audio_scan:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/scan"
    method: POST

  bt_audio_connect:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/connect"
    method: post
    content_type: "application/json"
    payload: '{"address": "{{ address }}"}'

  bt_audio_disconnect:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/disconnect"
    method: post
    content_type: "application/json"
    payload: '{"address": "{{ address }}"}'

  bt_audio_pair_device:
    # 19.11.2026 Claude, auf Wunsch des Nutzers: optional adapter (MAC des Sticks) - nach einem
    # Forget kennt das Add-on die Stick-Zuordnung nicht mehr und koppelt sonst am Hauptadapter.
    # timeout 60: Koppeln auf einem anderen Stick sucht die Box erst (dauert laenger als 10 s).
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/pair"
    method: POST
    content_type: "application/json"
    payload: '{"address": "{{ address }}"{% if adapter is defined and adapter %}, "adapter": "{{ adapter }}"{% endif %}}'
    timeout: 60

  bt_audio_set_mpd:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/devices/{{ address }}/settings"
    method: PUT
    content_type: "application/json"
    payload: '{"mpd_enabled": true, "mpd_port": {{ mpd_port }}}'

  # Lautstaerke fest auf 100 % (gepatchtes Add-on, ab 2.1.0-cc.6). Angelegt 02.11.2026 von Claude.
  # Aufruf: rest_command.bt_audio_set_volume_lock mit address (MAC) und lock (true/false).
  bt_audio_set_volume_lock:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/devices/{{ address }}/settings"
    method: PUT
    content_type: "application/json"
    payload: '{"volume_lock": {{ "true" if (lock | bool) else "false" }}}'

  bt_audio_get_devices:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/devices"
    method: GET
    content_type: "application/json"

  bt_audio_get_sinks:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/audio/sinks"
    method: get

  bt_audio_get_state:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/state"
    method: get

  bt_audio_get_info:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/info"
    method: get

  bt_audio_scan_status:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/scan/status"
    method: get

  bt_audio_get_adapters:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/adapters"
    method: get

  # Hauptadapter wechseln (danach Add-on-Neustart noetig). Repariert 21.11.2026 von Claude auf Wunsch
  # des Nutzers: Seit Add-on cc.24 braucht clean: true zusaetzlich confirm_unpair = Anzahl der Boxen,
  # die dabei entkoppelt werden (aus rest_command.bt_audio_set_adapter_impact, Feld count) - ohne
  # lehnt das Add-on mit 409 ab. Ohne clean ist keine Bestaetigung noetig.
  bt_audio_set_adapter:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/set-adapter"
    method: post
    content_type: "application/json"
    payload: '{"adapter": "{{ adapter }}", "clean": {{ "true" if clean | default(false) else "false" }}{% if confirm_unpair is defined %}, "confirm_unpair": {{ confirm_unpair | int }}{% endif %}}'

  bt_audio_set_adapter_impact:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/set-adapter/impact"
    method: get

  bt_audio_restart:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/restart"
    method: post

  # Bluetooth-Stick zuruecksetzen (gepatchtes Add-on, ab 2.1.0-cc.18). Angelegt 13.11.2026 von Claude.
  # Aufruf: rest_command.bt_audio_adapter_reset mit mode 'soft' (Adapter ueber BlueZ aus/an)
  # oder 'usb' (wie Abziehen und Einstecken, danach startet das Add-on neu). Antwort 409 = zu frueh.
  # Optional adapter = MAC eines Sticks: nur diesen zuruecksetzen; ohne = alle Sticks des Add-ons.
  # Ergaenzt 18.11.2026 von Claude (Stick-Reset je Stick).
  bt_audio_adapter_reset:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/adapter/reset"
    method: POST
    content_type: "application/json"
    payload: '{"mode": "{{ mode | default(''soft'') }}"{% if adapter | default('''') %}, "adapter": "{{ adapter }}"{% endif %}}'
    timeout: 30

  bt_audio_get_settings:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/settings"
    method: get

  bt_audio_put_settings:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/settings"
    method: put
    content_type: "application/json"
    # Ein Objekt (z. B. aus einer Automation) wird mit to_json zu JSON, ein fertiger
    # JSON-Text geht unveraendert durch. Umgestellt 18.11.2026 von Claude.
    payload: "{{ payload if payload is string else (payload | to_json) }}"

  bt_audio_get_logs:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/logs"
    method: get

  bt_audio_diagnostics_mpris:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/diagnostics/mpris"
    method: get

  # Bitrate je Box (sbc_frames_per_packet, at_lowest_step), genutzt vom Bitrate-Waechter unten.
  # Angelegt 21.11.2026 von Claude auf Wunsch des Nutzers.
  bt_audio_pulse_bluetooth:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/diagnostics/pulse-bluetooth"
    method: get
    timeout: 20

  # Aussetzer-Diagnose (Gap-Monitor, Add-on ab cc.9). Angelegt 21.11.2026 von Claude auf Wunsch des
  # Nutzers, genutzt von script.radiostream_aussetzer_diagnose. Start mit minutes (0.5-60, Standard 10);
  # Status/Ergebnis: events_per_sink (silence = Ton fehlte schon vor Bluetooth, stall = Bluetooth-Ausgang
  # stockte) und stall_clusters (gleichzeitig auf mehreren Boxen = gemeinsamer Stick/USB-Weg).
  bt_audio_gap_monitor_start:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/diagnostics/gap-monitor"
    method: post
    content_type: "application/json"
    payload: '{"minutes": {{ minutes | default(10) | float }}}'

  bt_audio_gap_monitor_status:
    url: "http://1b3a7c56-bluetooth-audio-manager:8099/api/diagnostics/gap-monitor"
    method: get

