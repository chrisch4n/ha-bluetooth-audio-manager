# Radiostream: Player, BT-Signal, BT Audio Manager und Senderliste in einem Paket
# (am 18.11.2026 zusammengeführt aus media_player.yaml, command_line.yaml, rest_command.yaml
# und templates/radio.yaml; configuration.yaml lädt den Ordner packages/ per homeassistant: packages:).
# Die Recorder-Ausschlüsse bleiben zentral in recorder.yaml.
# 18.11.2026 (Claude, auf Wunsch des Nutzers): Senderwahl und Presets als Template-Selects (select.*),
# die Universal-Player nutzen diese statt der input_select-Helfer.

media_player:
  - platform: universal
    name: "Radiostream 87.5"
    unique_id: radiostream_87_5_player
    children:
      - media_player.musik_radiostream_87_5
    commands:
      turn_on:
        service: script.radiostream_power_toggle
        data:
          player: "87_5"
          action: "on"
      turn_off:
        service: script.radiostream_power_toggle
        data:
          player: "87_5"
          action: "off"
      media_play:
        service: script.radiostream_power_toggle
        data:
          player: "87_5"
          action: "on"
      media_pause:
        service: script.radiostream_power_toggle
        data:
          player: "87_5"
          action: "off"
      media_stop:
        service: media_player.media_stop
        target:
          entity_id: media_player.musik_radiostream_87_5
      volume_up:
        service: media_player.volume_up
        target:
          entity_id: media_player.musik_radiostream_87_5
      volume_down:
        service: media_player.volume_down
        target:
          entity_id: media_player.musik_radiostream_87_5
      volume_set:
        service: media_player.volume_set
        target:
          entity_id: media_player.musik_radiostream_87_5
        data:
          volume_level: "{{ volume_level }}"
      volume_mute:
        service: media_player.volume_mute
        target:
          entity_id: media_player.musik_radiostream_87_5
        data:
          is_volume_muted: "{{ is_volume_muted }}"
      select_source:
        service: select.select_option
        target:
          entity_id: select.radiosender_87_5
        data:
          option: "{{ source }}"
      media_next_track:
        service: select.select_next
        target:
          entity_id: select.radiosender_87_5
      media_previous_track:
        service: select.select_previous
        target:
          entity_id: select.radiosender_87_5
    attributes:
