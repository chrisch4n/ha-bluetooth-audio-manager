  max_columns: 4
  cards: []
- title: Radio
  path: radio
  icon: m3o:radio
  type: panel
  cards:
  - type: custom:radiostream-radio-card
    title: Radiostream
- icon: mdi:radio
  path: radiostreams
  sections:
  - cards:
    - type: markdown
      content: ' '
      text_only: true
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none
          !important; min-height: 12px !important; }'
    - type: vertical-stack
      grid_options:
        columns: full
      cards:
      - type: tile
        entity: media_player.radiostream_87_5_sender
        name: Radiostream 87.5
        state_content:
        - state
        - source
        vertical: false
        features:
        - controls:
          - media_previous_track
          - media_play_pause
          - media_next_track
          type: media-player-playback
        - show_mute_button: true
          type: media-player-volume-slider
        - type: media-player-source
        features_position: bottom
        card_mod:
          style: 'ha-card { border-radius: 12px 12px 0 0 !important; box-shadow: none !important; margin-bottom:
            0 !important; border-bottom: none !important; }'
        tap_action:
          action: perform-action
          perform_action: script.radiostream_power_toggle
          data:
            player: '87_5'
            action: 'on'
      - type: grid
        columns: 5
        square: true
        cards:
        - type: button
          entity: input_select.radiostream_preset_1
          name: ''
          show_state: true
          tap_action:
            action: perform-action
            perform_action: script.radiostream_preset_abspielen
            data:
              preset: '1'
              ziel_helper: input_select.radiosender_87_5
          grid_options:
            columns: 4
            rows: 1
          card_mod:
            style: '{% set p = states(''input_select.radiostream_preset_1'') %}{% set s = states(''input_select.radiosender_87_5'')
              %}{% set active = p == s and p not in [''unknown'',''unavailable''] %}ha-card { justify-content:
