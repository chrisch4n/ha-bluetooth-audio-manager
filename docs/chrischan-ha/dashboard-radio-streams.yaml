        confirmation:
          text: 'Stick „Logilink alt“ (Hauptadapter) zurücksetzen, ohne ihn abzuziehen: erst
            Adapter aus und wieder an, die Boxen an diesem Stick sind dabei 1–2 Minuten still.
            Haben sie nach gut 2 Minuten noch keine Verbindung, folgt der USB-Reset (wie Abziehen
            und Einstecken) – dabei startet das Add-on neu und alle Sender sind kurz still.
            Fortfahren?'
