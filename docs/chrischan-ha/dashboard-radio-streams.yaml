      heading: Status
      icon: m3o:monitor-heart
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.bluetooth_audio_manager_chrischan_aktiv
        show_state: true
        show_icon: true
        color: green
    - type: tile
      entity: binary_sensor.radiostream_87_5_spielt_nicht
