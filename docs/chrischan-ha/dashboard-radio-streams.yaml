        columns: 4
    - type: tile
      entity: binary_sensor.radiostream_105_9_bitrate_unten
      name: Bitrate 105.9
      icon: mdi:waveform
      vertical: true
      state_content:
      - state
      - sbc_frames_per_packet
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.radiostream_boxen_ohne_verbindung
      name: Boxen ohne Verbindung
      icon: m3o:sync-problem
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.radiostream_sticks_ohne_verbindung
      name: Sticks ohne Verbindung
      icon: m3o:network-check
      grid_options:
        columns: 6
    - type: tile
      entity: script.radiostream_aussetzer_diagnose
      name: Aussetzer messen (10 Min, Ergebnis per Push)
      icon: m3o:monitor-heart
      hide_state: true
      grid_options:
        columns: 12
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.radiostream_aussetzer_diagnose
        data:
          variables:
            minuten: 10
        confirmation:
          text: 'Aussetzer-Diagnose: misst 10 Minuten lang jede Box (Stockungen am Bluetooth-Ausgang
            und Stille im Stream) und schickt das Ergebnis als Push. Die Sender laufen dabei
            normal weiter. Starten?'
      icon_tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.radiostream_aussetzer_diagnose
        data:
          variables:
            minuten: 10
        confirmation:
          text: 'Aussetzer-Diagnose: misst 10 Minuten lang jede Box (Stockungen am Bluetooth-Ausgang
            und Stille im Stream) und schickt das Ergebnis als Push. Die Sender laufen dabei
            normal weiter. Starten?'
    - type: markdown
      content: '**Frequenz** | **MAC** | **Port** | **Stick** | **Signal**

        :--|:--:|:--:|:--|:--

        {% set a = states(''input_text.radiostream_address_map'') | from_json %}{% set pm
        = states(''input_text.radiostream_port_map'') | from_json %}{% set st = states(''input_text.radiostream_stick_map'')
        | from_json(default={}) %}{% for p, l in [(''87_5'',''87.5''),(''97_0'',''97.0''),(''105_9'',''105.9'')]
        %}{% set sig = state_attr(''sensor.radiostream_bt_signal'', p) %}{{ l }} | {{ a[p]
        }} | {{ pm[p] }} | {{ st.get(p, ''–'') }} | {% if sig is mapping %}{% if sig.rssi
        is number %}{% set w = ''gut'' if sig.rssi >= -5 else (''mäßig'' if sig.rssi >= -15
        else (''schwach'' if sig.rssi >= -25 else ''kritisch'')) %}{{ sig.rssi }} dB · {{
        w }}{% else %}?{% endif %}{% if sig.tx_max %} · TX {{ sig.tx }}/{{ sig.tx_max }} dBm{%
        endif %}{% elif sig is string %}{{ sig }}{% else %}–{% endif %}

        {% endfor %}

        _MAC, Port und Stick live aus den zentralen Maps. Signal: Abstand zum Idealbereich
        des Sticks in dB, alle 2 Minuten ohne Scan gemessen; gut bis −5, mäßig bis −15, schwach
        bis −25, darunter kritisch; „Lesefehler“ = verbunden, aber nicht messbar._'
      entity_id:
      - input_text.radiostream_address_map
      - input_text.radiostream_port_map
      - input_text.radiostream_stick_map
      - sensor.radiostream_bt_signal
