# Dashboard "radio-streams" (Receiver, Reparatur, Presets, Radio, Radiostreams),
# Export der Rohkonfiguration aus Home Assistant, Stand 13.11.2026.
# Einfuegen ueber Dashboard > Bearbeiten > Rohkonfigurations-Editor.
# Enthaelt keine MACs, IPs, Benutzer- oder Geraete-IDs. Braucht card-mod/UIX;
# die Ansicht "Receiver" nutzt die eigene Karte custom:radiostream-receiver-card.
# Beschreibung des Systems: ../chrischan-radiostream.md
views:
- type: panel
  title: Receiver
  path: receiver
  icon: m3o:speaker
  cards:
  - type: custom:radiostream-receiver-card
    title: Radiostream
- path: reparatur
  title: Reparatur
  type: sections
  icon: mdi:wrench
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Wiedergabe
      icon: m3o:speaker
    - type: grid
      columns: 3
      square: false
      cards:
      - type: tile
        entity: binary_sensor.radiostream_87_5_spielt_nicht
        name: '87.5'
        icon: m3o:speaker
        vertical: true
        state_content:
        - state
        - last_changed
      - type: tile
        entity: binary_sensor.radiostream_97_0_spielt_nicht
        name: '97.0'
        icon: m3o:speaker
        vertical: true
        state_content:
        - state
        - last_changed
      - type: tile
        entity: binary_sensor.radiostream_105_9_spielt_nicht
        name: '105.9'
        icon: m3o:speaker
        vertical: true
        state_content:
        - state
        - last_changed
    - type: heading
      heading: Stufe 1 · Diagnose
      icon: mdi:magnify-scan
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: '87.5'
        icon: mdi:magnify-scan
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.radiostream_reparieren_ultralight
          data:
            variables:
              player: '87_5'
          confirmation:
            text: 'Stufe 1 · Diagnose für 87.5: prüft Bluetooth und Audio-Sink. Gesunde Verbindungen werden
              nie angefasst. Bei Bedarf: milder Connect wenn getrennt, MPD-Neustart wenn nur der Ton hängt,
              Force-Reconnect nur bei Verbindung ohne Audio. Hinweis: Die Prüfung selbst verursacht ein
              kurzes hörbares Stocken. Fortfahren?'
        show_state: false
      - type: button
        name: '97.0'
        icon: mdi:magnify-scan
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.radiostream_reparieren_ultralight
          data:
            variables:
              player: '97_0'
          confirmation:
            text: 'Stufe 1 · Diagnose für 97.0: prüft Bluetooth und Audio-Sink. Gesunde Verbindungen werden
              nie angefasst. Bei Bedarf: milder Connect wenn getrennt, MPD-Neustart wenn nur der Ton hängt,
              Force-Reconnect nur bei Verbindung ohne Audio. Hinweis: Die Prüfung selbst verursacht ein
              kurzes hörbares Stocken. Fortfahren?'
        show_state: false
      - type: button
        name: '105.9'
        icon: mdi:magnify-scan
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.radiostream_reparieren_ultralight
          data:
            variables:
              player: '105_9'
          confirmation:
            text: 'Stufe 1 · Diagnose für 105.9: prüft Bluetooth und Audio-Sink. Gesunde Verbindungen
              werden nie angefasst. Bei Bedarf: milder Connect wenn getrennt, MPD-Neustart wenn nur der
              Ton hängt, Force-Reconnect nur bei Verbindung ohne Audio. Hinweis: Die Prüfung selbst verursacht
              ein kurzes hörbares Stocken. Fortfahren?'
        show_state: false
    - type: heading
      heading: Stufe 2 · Steckdosen-Zyklus
      icon: mdi:power-cycle
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: '87.5'
        icon: mdi:power-plug-outline
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          data:
            variables:
              player: '87_5'
          confirmation:
            text: 'Stufe 2 · Steckdosen-Zyklus für 87.5: Steckdose 30 s stromlos, danach wieder an. Kein
              Add-on-Neustart, die anderen beiden Streams laufen weiter. Fortfahren?'
          target:
            entity_id: script.radiostream_steckdose_zyklieren
        show_state: false
      - type: button
        name: '97.0'
        icon: mdi:power-plug-outline
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          data:
            variables:
              player: '97_0'
          confirmation:
            text: 'Stufe 2 · Steckdosen-Zyklus für 97.0: Steckdose 30 s stromlos, danach wieder an. Kein
              Add-on-Neustart, die anderen beiden Streams laufen weiter. Fortfahren?'
          target:
            entity_id: script.radiostream_steckdose_zyklieren
        show_state: false
      - type: button
        name: '105.9'
        icon: mdi:power-plug-outline
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          data:
            variables:
              player: '105_9'
          confirmation:
            text: 'Stufe 2 · Steckdosen-Zyklus für 105.9: Steckdose 30 s stromlos, danach wieder an. Kein
              Add-on-Neustart, die anderen beiden Streams laufen weiter. Fortfahren?'
          target:
            entity_id: script.radiostream_steckdose_zyklieren
        show_state: false
    - type: tile
      entity: script.radiostream_steckdosen_alle_zyklieren
      name: Alle drei (nacheinander, ca. 6 Min)
      icon: m3o:power-settings-new
      grid_options:
        columns: full
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.radiostream_steckdosen_alle_zyklieren
        confirmation:
          text: 'Stufe 2 · Steckdosen-Zyklus für ALLE DREI, nacheinander: jede eingeschaltete Box 30 s
            stromlos, dann wieder an, 90 s später die nächste. Es ist immer nur ein Sender still; dauert
            etwa 6 Minuten. Kein Add-on-Neustart, ausgeschaltete Boxen bleiben aus. Läuft auch jede Nacht
            um 04:30. Fortfahren?'
    - type: heading
      heading: Bluetooth-Stick
      icon: m3o:developer-board
    - type: tile
      entity: script.radiostream_stick_zuruecksetzen
      name: Stick zurücksetzen
      icon: m3o:developer-board
      grid_options:
        columns: 6
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.radiostream_stick_zuruecksetzen
        data:
          variables:
            stufe: auto
            ausloeser: Dashboard
        confirmation:
          text: 'Bluetooth-Stick zurücksetzen, ohne ihn abzuziehen: erst Adapter aus und wieder an; sind
            danach noch zwei oder mehr Boxen ohne Verbindung, folgt der USB-Reset (wie Abziehen und Einstecken,
            das Add-on startet neu). Alle drei Sender sind dabei 1–2 Minuten still. Läuft bei 2+ Boxen
            ohne Verbindung nach 4 Minuten auch automatisch. Fortfahren?'
    - type: tile
      entity: sensor.radiostream_boxen_ohne_verbindung
      name: Boxen ohne Verbindung
      icon: m3o:sync-problem
      grid_options:
        columns: 6
    - type: heading
      heading: Stufe 3 · Voll-Reparatur
      icon: mdi:wrench
    - type: tile
      entity: script.radiostream_reparieren
      name: Voll-Reparatur (Add-on-Neustart, alle drei)
      icon: mdi:wrench
      grid_options:
        columns: full
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.radiostream_reparieren
        confirmation:
          text: 'Stufe 3 · Voll-Reparatur für ALLE DREI Streams: Steckdosen aus, Add-on-Neustart, Steckdosen
            gestaffelt wieder an, MPD neu laden. Unterbricht alle drei Boxen für ca. 2 Minuten. Fortfahren?'
    - type: heading
      heading: Notfall · Neu koppeln (nur manuell)
      icon: mdi:alert-octagon
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: '87.5'
        icon: mdi:bluetooth-transfer
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          data:
            variables:
              address: '{{ (states(''input_text.radiostream_address_map'') | from_json)[''87_5''] }}'
              mpd_port: '{{ (states(''input_text.radiostream_port_map'') | from_json)[''87_5''] | int
                }}'
          confirmation:
            text: 'Notfall · Neu koppeln für 87.5: Die Box wird vergessen und neu gekoppelt. Nur verwenden,
              wenn Stufe 1 bis 3 nicht geholfen haben. Wird die Box nicht gefunden: Box in den Kopplungsmodus
              versetzen (Taste halten, bis die LED schnell blinkt) und erneut versuchen. Fortfahren?'
          target:
            entity_id: script.radiostream_notfall_forget_pair
      - type: button
        name: '97.0'
        icon: mdi:bluetooth-transfer
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          data:
            variables:
              address: '{{ (states(''input_text.radiostream_address_map'') | from_json)[''97_0''] }}'
              mpd_port: '{{ (states(''input_text.radiostream_port_map'') | from_json)[''97_0''] | int
                }}'
          confirmation:
            text: 'Notfall · Neu koppeln für 97.0: Die Box wird vergessen und neu gekoppelt. Nur verwenden,
              wenn Stufe 1 bis 3 nicht geholfen haben. Wird die Box nicht gefunden: Box in den Kopplungsmodus
              versetzen (Taste halten, bis die LED schnell blinkt) und erneut versuchen. Fortfahren?'
          target:
            entity_id: script.radiostream_notfall_forget_pair
      - type: button
        name: '105.9'
        icon: mdi:bluetooth-transfer
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          data:
            variables:
              address: '{{ (states(''input_text.radiostream_address_map'') | from_json)[''105_9''] }}'
              mpd_port: '{{ (states(''input_text.radiostream_port_map'') | from_json)[''105_9''] | int
                }}'
          confirmation:
            text: 'Notfall · Neu koppeln für 105.9: Die Box wird vergessen und neu gekoppelt. Nur verwenden,
              wenn Stufe 1 bis 3 nicht geholfen haben. Wird die Box nicht gefunden: Box in den Kopplungsmodus
              versetzen (Taste halten, bis die LED schnell blinkt) und erneut versuchen. Fortfahren?'
          target:
            entity_id: script.radiostream_notfall_forget_pair
    - type: heading
      heading: Steckdosen manuell
      icon: mdi:power-socket-de
    - type: grid
      columns: 3
      square: false
      cards:
      - type: tile
        entity: switch.dose_bt_87_5
        name: '87.5'
        icon: mdi:power-plug
        icon_tap_action:
          action: toggle
          confirmation:
            text: Steckdose 87.5 wirklich schalten? Beim Ausschalten verliert die Box sofort den Strom.
      - type: tile
        entity: switch.dose_bt_97_0
        name: '97.0'
        icon: mdi:power-plug
        icon_tap_action:
          action: toggle
          confirmation:
            text: Steckdose 97.0 wirklich schalten? Beim Ausschalten verliert die Box sofort den Strom.
      - type: tile
        entity: switch.dose_bt_105_9
        name: '105.9'
        icon: mdi:power-plug
        icon_tap_action:
          action: toggle
          confirmation:
            text: Steckdose 105.9 wirklich schalten? Beim Ausschalten verliert die Box sofort den Strom.
    - type: tile
      entity: switch.radiostream_steckdosen_alle
      name: Alle drei
      icon: m3o:power-plug
      grid_options:
        columns: full
      icon_tap_action:
        action: toggle
        confirmation:
          text: Alle drei Steckdosen schalten? Beim Ausschalten verlieren alle Boxen sofort den Strom;
            beim Einschalten gehen alle gleichzeitig an (für einen schonenden Neustart besser Stufe 2
            · Alle drei).
    - type: heading
      heading: Einstellungen & Status
      icon: mdi:cog
    - type: markdown
      content: '**Frequenz** | **MAC** | **Port**

        :--|:--:|:--:

        {% set a = states(''input_text.radiostream_address_map'') | from_json %}{% set pm = states(''input_text.radiostream_port_map'')
        | from_json %}{% for p, l in [(''87_5'',''87.5''),(''97_0'',''97.0''),(''105_9'',''105.9'')] %}{{
        l }} | {{ a[p] }} | {{ pm[p] }}

        {% endfor %}

        _MAC und Port live aus den zentralen Maps._'
      entity_id:
      - input_text.radiostream_address_map
      - input_text.radiostream_port_map
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: input_boolean.radiostream_power_schaltet_steckdosen
        name: Power schaltet Steckdosen
        icon: mdi:power-socket-de
        tap_action:
          action: toggle
      - type: tile
        entity: input_boolean.radiostream_lautstarke_fest_100
        name: Lautstärke fest
        icon: m3o:volume-up
        tap_action:
          action: toggle
      - type: tile
        entity: input_number.radiostream_lautstarke_alle_boxen
        name: Lautstärke alle Boxen
        icon: m3o:volume-down
        features:
        - type: numeric-input
          style: slider
      - type: tile
        entity: automation.radiostream_player_unavailable_bt_audio_manager_bug_watch
        name: Watchdog
        icon: mdi:shield-alert
        show_entity_picture: false
        features:
        - type: toggle
      - type: tile
        entity: input_datetime.radiostream_letzte_automatische_voll_reparatur
        name: Letzte Auto-Reparatur
        icon: mdi:wrench-clock
      - type: tile
        entity: automation.radiostream_nachtlicher_steckdosen_zyklus
        name: Nachts zyklieren (04:30)
        icon: m3o:bedtime
        features:
        - type: toggle
- path: presets
  title: Presets
  type: sections
  icon: mdi:radiobox-marked
  sections:
