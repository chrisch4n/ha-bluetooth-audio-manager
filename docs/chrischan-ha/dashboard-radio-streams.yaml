      icon: m3o:network-check
      grid_options:
        columns: 6
    - type: markdown
      content: '**Frequenz** | **MAC** | **Port** | **Stick** | **Signal**

        :--|:--:|:--:|:--|:--

        {% set a = states(''input_text.radiostream_address_map'') | from_json %}{% set pm
