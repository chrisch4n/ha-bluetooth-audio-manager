# Dashboard "radio-streams" (Receiver, Reparatur),
# Export der Rohkonfiguration aus Home Assistant, Stand 21.11.2026.
# Einfuegen ueber Dashboard > Bearbeiten > Rohkonfigurations-Editor.
# Enthaelt keine MACs, IPs, Benutzer- oder Geraete-IDs. Braucht card-mod/UIX;
# die Ansicht "Receiver" nutzt die eigene Karte custom:radiostream-receiver-card.
# Beschreibung des Systems: ../chrischan-radiostream.md
views:
- type: panel
  title: Receiver
  path: receiver
  icon: m3o:speaker
  cards:
  - type: custom:radiostream-receiver-card
    title: Radiostream
- title: Reparatur
  path: reparatur
  icon: m3o:build
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: m3o:monitor-heart
      heading_style: title
      badges:
      - type: entity
        entity: binary_sensor.bluetooth_audio_manager_chrischan_aktiv
        show_state: true
        show_icon: true
        color: green
    - type: tile
      entity: binary_sensor.radiostream_87_5_spielt_nicht
      name: '87.5'
      icon: m3o:speaker
      vertical: true
      state_content:
      - state
      - last_changed
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.radiostream_97_0_spielt_nicht
      name: '97.0'
      icon: m3o:speaker
      vertical: true
      state_content:
      - state
      - last_changed
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.radiostream_105_9_spielt_nicht
      name: '105.9'
      icon: m3o:speaker
      vertical: true
      state_content:
      - state
      - last_changed
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.radiostream_87_5_bitrate_unten
      name: Bitrate 87.5
      icon: mdi:waveform
      vertical: true
      state_content:
      - state
      - sbc_frames_per_packet
      grid_options:
        columns: 4
    - type: tile
      entity: binary_sensor.radiostream_97_0_bitrate_unten
      name: Bitrate 97.0
      icon: mdi:waveform
      vertical: true
      state_content:
